# ── OrcAgent — nginx reverse proxy ──
# Plain HTTP only. Run certbot afterwards (see deploy/README.md); it rewrites
# this file to add the certificate and the HTTPS redirect for you, so there
# is nothing here to keep in sync by hand.

server {
    listen 80;
    listen [::]:80;
    server_name orcagent.fun www.orcagent.fun;

    # Wallet avatars and banners are base64 data-URIs in the request body,
    # which is why this is well above nginx's 1 MB default.
    client_max_body_size 12M;

    access_log /var/log/nginx/orcagent.access.log;
    error_log  /var/log/nginx/orcagent.error.log;

    # Served straight off disk rather than through the app, so gunicorn's
    # single worker is never occupied handing out a stylesheet.
    location /static/ {
        alias /opt/orcagent/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app sees every request as http:// once certbot is
        # in front, which breaks OAuth redirects and secure-cookie handling.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A buy or sell waits on an on-chain confirmation, which can take
        # longer than nginx's 60s default -- that timeout would abandon the
        # request while the trade is still settling.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 15s;

        proxy_buffering off;   # keeps the live feeds streaming rather than arriving in chunks
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}
