<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="client-secret" content="{{ client_secret }}">
<title>{{ mint_short }} — OrcAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<script src="/static/vendor/lightweight-charts.standalone.production.js?v=4.1.3" defer></script>
<link rel="stylesheet" href="/static/token-card.css?v={{ app_version }}">
<style>
/* Lean shell around the shared token card (static/token-card.css/.js) --
   just enough page chrome (back link + title) to not be a bare card
   floating on a blank background. No market table, no scanner, no modal
   backdrop -- this page IS the card. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0b0e;--bg2:#101216;--bg3:#16191f;--bg4:#21252c;--accent:#f7b955;--text:#eef1f5;--muted:#565d68;--green:#3ad29b;--red:#ff4d6a}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}

.tc-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bg3)}
.tc-back{text-decoration:none;color:var(--muted);font-size:11px;white-space:nowrap;transition:color .15s;flex-shrink:0}
.tc-back:hover{color:var(--text)}
.tc-title-wrap{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.tc-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap}
.tc-subtitle{font-size:10px;color:var(--muted);white-space:nowrap}

.tc-wrap{max-width:900px;margin:20px auto;padding:0 16px 40px}
@media(max-width:767px){
  .tc-wrap{margin:0;padding:0 0 40px}
  .tc-wrap .lm-modal-card{border-radius:0}
}

::-webkit-scrollbar{height:4px;width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
</style>
</head>
<body>

<header class="tc-header">
  <a class="tc-back" href="/">← Back</a>
  <div class="tc-title-wrap">
    <div class="tc-title">Token Detail</div>
    <div class="tc-subtitle">{{ mint_short }}</div>
  </div>
</header>

<div class="tc-wrap">
  <div class="lm-modal-card">
    <div id="lm-modal-body"></div>
  </div>
</div>

<script src="/static/token-card.js?v={{ app_version }}"></script>
<script>
'use strict';
// showTokenCard() -> _lmtdInitChart() needs LightweightCharts, loaded via a
// deferred <script> in <head> -- deferred scripts only run once the document
// has finished parsing, which is AFTER this inline script. Calling
// showTokenCard() immediately here raced it (ReferenceError: LightweightCharts
// is not defined). Waiting for DOMContentLoaded guarantees it has already run.
document.addEventListener('DOMContentLoaded', function(){
  showTokenCard({{ mint_address | tojson }}, {{ mint_address | tojson }});
});
</script>
</body>
</html>
