<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Calls — OrcAgent</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OrcAgent">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=6">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b0e;--bg2:#101216;--bg3:#14171c;--bg4:#16191f;
  --accent:#f7b955;--accent-dim:rgba(247,185,85,.12);--accent-border:rgba(247,185,85,.25);
  --text:#eef1f5;--muted:#565d68;--sub:#8a919c;
  --green:#3ad29b;--red:#f76b62;
  --mono:'JetBrains Mono','Share Tech Mono',monospace;
  --ui:'Geist',system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
html,body{min-height:100vh;background:var(--bg);font-family:var(--ui);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* Nav is now the shared navbar component (static/navbar.css). */

/* ── PAGE ── */
.page{max-width:800px;margin:0 auto;padding:28px 24px 120px}
.page-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.page-sub{color:var(--sub);font-size:13px;margin-bottom:22px}
.live-badge{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--green);flex-shrink:0;padding-top:3px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:live-pulse 1.6s infinite}
@keyframes live-pulse{
  0%{box-shadow:0 0 0 0 rgba(58,210,155,.55)}
  70%{box-shadow:0 0 0 8px rgba(58,210,155,0)}
  100%{box-shadow:0 0 0 0 rgba(58,210,155,0)}
}

/* ── PODIUM ── */
.podium-wrap{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px}
.podium-card{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--bg4);border-radius:14px;padding:16px 10px;text-align:center}
.podium-card.p1{order:2;padding:26px 12px 22px;border-color:var(--accent-border);background:linear-gradient(180deg,var(--accent-dim),var(--bg2) 65%);box-shadow:0 8px 24px rgba(247,185,85,.08)}
.podium-card.p2{order:1}
.podium-card.p3{order:3}
.podium-rank{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--muted);margin-bottom:8px}
.podium-card.p1 .podium-rank{color:var(--accent);font-size:13px}
.podium-tile{width:42px;height:42px;border-radius:11px;background:var(--bg4);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--sub);overflow:hidden}
.podium-card.p1 .podium-tile{width:54px;height:54px;font-size:14px}
.podium-sym{font-weight:700;font-size:12.5px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-multi{font-family:var(--mono);font-weight:800;font-size:19px;color:var(--green)}
.podium-card.p1 .podium-multi{font-size:25px}
.podium-multi.neg{color:var(--red)}
.podium-caller{font-size:10.5px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-info{min-width:0}
.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:4px 2px 10px}

/* ── MAKE A CALL ── */
.call-box{background:var(--bg2);border:1px solid var(--bg4);border-radius:14px;padding:16px;margin-bottom:20px;position:relative}
.call-box-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.call-input-row{display:flex;gap:8px}
.call-input{flex:1;background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;font-family:var(--ui)}
.call-input:focus{border-color:var(--accent-border)}
.call-btn{background:var(--accent);color:#0a0b0e;border:none;border-radius:10px;padding:0 20px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.call-btn:hover{opacity:.9}
.call-btn:disabled{opacity:.5;cursor:default}
.call-limit-note{font-size:11px;color:var(--muted);margin-top:8px}
.call-dropdown{position:absolute;left:16px;right:16px;top:100%;margin-top:4px;background:var(--bg3);border:1px solid var(--bg4);border-radius:11px;overflow:hidden;max-height:260px;overflow-y:auto;z-index:20;display:none}
.call-dd-row{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--bg4);display:flex;align-items:center;justify-content:space-between}
.call-dd-row:last-child{border-bottom:none}
.call-dd-row:hover{background:var(--bg4)}
.call-dd-sym{font-weight:700;font-size:13px}
.call-dd-name{color:var(--muted);font-size:11px}
.call-dd-price{font-family:var(--mono);font-size:12px;color:var(--sub)}
.call-msg{font-size:12px;margin-top:8px}
.call-msg.ok{color:var(--green)}
.call-msg.err{color:var(--red)}

/* ── TABS ── */
.calls-tabs{display:flex;gap:6px;margin-bottom:16px}
.calls-tab{background:var(--bg3);border:1px solid var(--bg4);color:var(--muted);font-size:12px;font-weight:700;padding:7px 15px;border-radius:9px;cursor:pointer;font-family:var(--ui)}
.calls-tab.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)}

/* ── CALLS LIST ── */
.call-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--bg4);border-radius:13px;margin-bottom:8px;transition:border-color .12s,background .12s}
.call-row:hover{border-color:var(--bg3);background:var(--bg3)}
.call-rank{width:26px;text-align:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.call-rank.top1{color:#f7b955}
.call-rank.top2{color:#c8c8d4}
.call-rank.top3{color:#cd8c52}
.call-avatar{width:34px;height:34px;border-radius:50%;background:var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub);overflow:hidden}
.call-avatar img{width:100%;height:100%;object-fit:cover}
/* Every text line here is single-line-or-ellipsis on purpose: these rows sit
   in a ranked list, and a card that grows a line taller than its neighbours
   breaks the rhythm of the whole column. min-width:0 lets the flex child
   actually shrink so the ellipsis can happen at all. */
.call-info{flex:1;min-width:0;overflow:hidden}
.call-mcap,.call-token{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The username is the only part allowed to lose characters -- the time and
   the call's entry mcap are the point of the line, so they never shrink.
   Ellipsising the whole line instead cut the mcap off behind long names. */
.call-caller{font-size:11.5px;color:var(--sub);line-height:1.35;display:flex;min-width:0}
.call-caller-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.call-caller-meta{white-space:nowrap;flex-shrink:0}
.call-token-line{display:flex;align-items:center;gap:7px;margin-top:1px;min-width:0}
.call-token{font-weight:700;font-size:14.5px;line-height:1.25;letter-spacing:-.01em;min-width:0}
.call-mcap{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.35;font-family:var(--mono)}
/* Only the multiplier sits on the right. The entry→peak pair used to live
   here too, but two full-precision prices are ~125px of unshrinkable text --
   on a phone that starved the name column and pushed the whole row off
   screen. It now runs along the left column's own line, where the width
   actually exists. */
.call-multi{text-align:right;flex-shrink:0;display:flex;align-items:center}
.call-multi-val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--green);line-height:1.1;letter-spacing:-.02em}
.call-multi-val.neg{color:var(--red)}
.calls-empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}

/* ── LIKE BUTTON ── */
.call-like-btn{display:flex;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:10.5px;cursor:pointer;padding:0;flex-shrink:0;line-height:1}
.call-like-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;transition:transform .12s}
.call-like-btn.liked{color:var(--red)}
.call-like-btn.liked svg{fill:var(--red);stroke:var(--red)}
.call-like-btn:active svg{transform:scale(1.2)}
.call-row{cursor:pointer}
.call-row-top{display:flex;align-items:center;gap:14px}
.podium-card{cursor:pointer;position:relative}
.podium-like{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px}
@media(max-width:767px){
  .podium-card .podium-like{margin-top:0;margin-left:6px}
}

@media(max-width:767px){
  html,body{overflow-x:clip}  /* clip, not hidden: hidden makes the root a scroll container, which breaks the sticky navbar */
  .page{padding:16px 14px 120px}
  .podium-wrap{flex-direction:column;align-items:stretch;gap:8px}
  .podium-card{order:0!important;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px!important}
  .podium-card .podium-rank{margin-bottom:0}
  .podium-card .podium-tile{margin:0}
  .podium-card.p1 .podium-tile{width:42px;height:42px;font-size:12px}
  .podium-card .podium-sym{margin-bottom:2px}
  .podium-card .podium-caller{margin-top:0}
  .podium-card .podium-multi{margin-left:auto;flex-shrink:0}
  .podium-card.p1 .podium-multi{font-size:19px}

  /* Phone widths are where this list was breaking: the entry→peak price pair
     is the widest fixed element in the row, and at the old size it starved
     the text column until it wrapped. Trim the fixed side, tighten the
     gutters, and the flexible side gets the space back. */
  .call-row{gap:10px;padding:11px 12px}
  .call-rank{width:20px;font-size:11px}
  .call-avatar{width:30px;height:30px;font-size:12px}
  .call-token{font-size:14px}
  .call-multi-val{font-size:16px}

}
</style>
</head>
<body>

{{ navbar_html('calls') }}

<!-- BODY -->
<div class="page">
  <div class="page-header-row">
    <div>
      <div class="page-title">Token Calls</div>
      <div class="page-sub">Call a token publicly · ranked by gain since call · max {{ calls_per_day_limit }}/day</div>
    </div>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
  </div>

  <div class="podium-wrap" id="calls-podium" style="display:none"></div>

  <div class="call-box">
    <div class="call-box-label">Make a call</div>
    <div class="call-input-row">
      <input class="call-input" id="call-search-input" type="text" placeholder="Search token by name or paste an address…" autocomplete="off">
      <button class="call-btn" id="call-submit-btn" disabled onclick="_submitCall()">Call it</button>
    </div>
    <div class="call-dropdown" id="call-dropdown"></div>
    <div class="call-msg" id="call-msg"></div>
    <div class="call-limit-note" id="call-limit-note"></div>
  </div>

  <div class="calls-tabs">
    <button class="calls-tab active" data-window="24h" onclick="_setCallsWindow('24h')">24H</button>
    <button class="calls-tab" data-window="7d" onclick="_setCallsWindow('7d')">7D</button>
    <button class="calls-tab" data-window="all" onclick="_setCallsWindow('all')">ALL</button>
  </div>

  <div class="section-label">Recent Calls</div>
  <div id="calls-list">
    <div class="calls-empty">Loading calls…</div>
  </div>
</div>

<script>
var _callsCsrfToken = {{ csrf_token|tojson }};
var _callsWindow = '24h';
var _callSelected = null; // {mint, symbol, name, price}
var _callSearchTimer = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }

function _fmtMultiplier(m){
  return (m>=1 ? m.toFixed(2) : m.toFixed(3)) + 'x';
}
function _fmtCallPrice(p){
  if(p >= 1) return '$'+p.toFixed(4);
  if(p >= 0.01) return '$'+p.toFixed(6);
  return '$'+p.toPrecision(3);
}
function _fmtMcap(m){
  if(m >= 1e6) return '$'+(m/1e6).toFixed(2)+'M';
  if(m >= 1e3) return '$'+(m/1e3).toFixed(1)+'K';
  return '$'+m.toFixed(0);
}
function _timeAgo(ts){
  var then = new Date(ts.replace(' ','T')+'Z').getTime();
  var diffMin = Math.floor((Date.now()-then)/60000);
  if(diffMin < 1) return 'just now';
  if(diffMin < 60) return diffMin+'m ago';
  var diffH = Math.floor(diffMin/60);
  if(diffH < 24) return diffH+'h ago';
  return Math.floor(diffH/24)+'d ago';
}

function _setCallsWindow(w){
  _callsWindow = w;
  document.querySelectorAll('.calls-tab').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-window')===w);
  });
  _loadCallsList();
}

var _HEART_SVG = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
function _likeBtnHtml(c, extraCls){
  var liked = !!c.liked_by_me;
  return '<button class="call-like-btn'+(extraCls?' '+extraCls:'')+(liked?' liked':'')+'" data-call-id="'+c.id+'" '
    +'onclick="event.stopPropagation();_toggleCallLike(this)" aria-label="Like this call">'
    +_HEART_SVG+'<span>'+(c.like_count||0)+'</span></button>';
}
function _goToToken(mint){
  if(!mint) return;
  window.location = '/live-market?mint=' + encodeURIComponent(mint);
}

function _renderPodium(top3){
  var el = document.getElementById('calls-podium');
  if(!top3.length){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='flex';
  el.innerHTML = top3.map(function(c, i){
    var rank = i+1;
    var neg = c.multiplier < 1 ? ' neg' : '';
    return '<div class="podium-card p'+rank+'" onclick="_goToToken(\''+esc(c.mint)+'\')">'
      +'<div class="podium-rank">#'+rank+'</div>'
      +'<div class="podium-tile">'+esc((c.symbol||'?').slice(0,3).toUpperCase())+'</div>'
      +'<div class="podium-info">'
        +'<div class="podium-sym">$'+esc(c.symbol||'?')+'</div>'
        +'<div class="podium-caller">'+esc(c.caller_username||'')+(c.caller_verified?' ✓':'')+'</div>'
      +'</div>'
      +'<div class="podium-multi'+neg+'">'+_fmtMultiplier(c.multiplier)+'</div>'
      +_likeBtnHtml(c, 'podium-like')
    +'</div>';
  }).join('');
}

function _toggleCallLike(btn){
  var callId = btn.getAttribute('data-call-id');
  var wasLiked = btn.classList.contains('liked');
  var countEl = btn.querySelector('span');
  var count = parseInt(countEl.textContent, 10) || 0;
  // Optimistic update -- flip immediately, reconcile with the server's real
  // count when the response lands, and roll back on failure.
  btn.classList.toggle('liked', !wasLiked);
  countEl.textContent = wasLiked ? Math.max(0, count-1) : count+1;
  fetch('/api/calls/'+callId+'/like', {
    method: 'POST',
    headers: {'X-CSRF-Token': _callsCsrfToken}
  }).then(function(r){ return r.json(); }).then(function(d){
    if(!d.ok){
      btn.classList.toggle('liked', wasLiked);
      countEl.textContent = count;
      return;
    }
    btn.classList.toggle('liked', d.liked);
    countEl.textContent = d.count;
  }).catch(function(){
    btn.classList.toggle('liked', wasLiked);
    countEl.textContent = count;
  });
}

async function _loadCallsList(){
  var el = document.getElementById('calls-list');
  try{
    var r = await fetch('/api/calls/top?window='+_callsWindow);
    var d = await r.json();
    if(!d.ok || !d.calls.length){
      _renderPodium([]);
      el.innerHTML = '<div class="calls-empty">No calls yet in this window. Be the first!</div>';
      return;
    }
    _renderPodium(d.calls.slice(0, 3));
    var rest = d.calls.slice(3);
    if(!rest.length){
      el.innerHTML = '<div class="calls-empty">Top 3 shown above — that\'s everyone in this window.</div>';
      return;
    }
    el.innerHTML = rest.map(function(c, i){
      var rank = i+4;
      var neg = c.multiplier < 1 ? ' neg' : '';
      var avatarHtml = c.caller_avatar
        ? '<img src="'+esc(c.caller_avatar)+'" alt="">'
        : esc((c.caller_username||'?').slice(0,2).toUpperCase());
      // The like button lives on the symbol's own line rather than in the
      // row's flex flow: sitting between the text and the multiplier, it
      // squeezed the text column until "Called at … mcap" wrapped onto three
      // lines and no two cards were the same height.
      return '<div class="call-row" onclick="_goToToken(\''+esc(c.mint)+'\')">'
        +'<div class="call-rank">#'+rank+'</div>'
        +'<div class="call-avatar">'+avatarHtml+'</div>'
        +'<div class="call-info">'
          +'<div class="call-caller">'
            +'<span class="call-caller-name">'+esc(c.caller_username||'')+(c.caller_verified?' ✓':'')+'</span>'
            +'<span class="call-caller-meta"> · '+_timeAgo(c.timestamp)+' · @ '+_fmtMcap(c.mcap_at_call||0)+'</span>'
          +'</div>'
          +'<div class="call-token-line">'
            +'<span class="call-token">$'+esc(c.symbol||'?')+'</span>'
            +_likeBtnHtml(c)
          +'</div>'
          +'<div class="call-mcap">'+_fmtCallPrice(c.price_at_call)+' → '+_fmtCallPrice(c.peak_price)+'</div>'
        +'</div>'
        +'<div class="call-multi">'
          +'<div class="call-multi-val'+neg+'">'+_fmtMultiplier(c.multiplier)+'</div>'
        +'</div>'
      +'</div>';
    }).join('');
  }catch(e){
    el.innerHTML = '<div class="calls-empty">Could not load calls.</div>';
  }
}

function _callSearchInput(){
  var q = document.getElementById('call-search-input').value.trim();
  var dd = document.getElementById('call-dropdown');
  _callSelected = null;
  document.getElementById('call-submit-btn').disabled = true;
  clearTimeout(_callSearchTimer);
  if(q.length < 2){ dd.style.display='none'; return; }
  _callSearchTimer = setTimeout(function(){
    dd.style.display = 'block';
    dd.innerHTML = '<div class="call-dd-row" style="cursor:default;color:var(--muted)">Searching…</div>';
    // Was a hardcoded chainId==='solana' filter hitting DexScreener directly
    // from the browser -- every BSC/Base/Arbitrum/Polygon/Robinhood token
    // was silently thrown away here, so picking one to call was impossible
    // even after /api/calls itself learned to accept non-Solana addresses.
    // Now goes through our own proxy (same cache+backoff as the navbar
    // search, plus its address-lookup fallback for brand-new chains) and
    // keeps every chain this app actually supports trading on.
    var _liveChains = (typeof _NB_LIVE_CHAINS!=='undefined') ? _NB_LIVE_CHAINS : ['solana'];
    var _chainLbls  = (typeof _NB_CHAIN_LABELS!=='undefined') ? _NB_CHAIN_LABELS : {solana:'SOL'};
    fetch('/api/dexscreener/search?q='+encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var pairs = (d.pairs||[]).filter(function(p){ return _liveChains.indexOf(p.chainId)!==-1; }).slice(0,6);
      if(!pairs.length){
        // DexScreener's fuzzy /search index can lag behind its own direct
        // per-token lookup for a brand-new pair (Robinhood Chain days old) --
        // /api/dexscreener/search already has its own address-lookup
        // fallback for that, but the query has to actually BE an address
        // for it to trigger. If the user pasted one and still got nothing
        // back (this pair genuinely isn't indexed by DexScreener at all
        // yet), fall back to /api/token/info/, the same robust,
        // chain-agnostic direct lookup the navbar search's click-through
        // and Live Market's ?mint= deep link already rely on.
        if(_looksLikeTokenAddress(q)){ _callDirectLookup(q, dd, _chainLbls); return; }
        dd.innerHTML='<div class="call-dd-row" style="cursor:default;color:var(--muted)">No tokens found</div>';
        return;
      }
      dd.innerHTML = _callDdRowsHtml(pairs, _chainLbls);
      window._callDdPairs = pairs;
    })
    .catch(function(){ dd.innerHTML='<div class="call-dd-row" style="cursor:default;color:var(--red)">Search failed</div>'; });
  }, 300);
}

function _looksLikeTokenAddress(q){
  return /^0x[0-9a-fA-F]{40}$/.test(q) || /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(q);
}

function _callDdRowsHtml(pairs, chainLbls){
  return pairs.map(function(p,i){
    var sym = (p.baseToken&&p.baseToken.symbol)||'?';
    var name = (p.baseToken&&p.baseToken.name)||'';
    var chainLbl = chainLbls[p.chainId] || p.chainId;
    var price = p.priceUsd ? _fmtCallPrice(parseFloat(p.priceUsd)) : '—';
    return '<div class="call-dd-row" onclick="_pickCallToken('+i+')">'
      +'<div><div class="call-dd-sym">'+esc(sym)+' <span style="color:var(--muted);font-weight:400">'+esc(chainLbl)+'</span></div><div class="call-dd-name">'+esc(name)+'</div></div>'
      +'<div class="call-dd-price">'+price+'</div></div>';
  }).join('');
}

function _callDirectLookup(addr, dd, chainLbls){
  fetch('/api/token/info/'+encodeURIComponent(addr))
  .then(function(r){ return r.json(); })
  .then(function(info){
    if(!info.ok){ dd.innerHTML='<div class="call-dd-row" style="cursor:default;color:var(--muted)">No tokens found</div>'; return; }
    // Reshaped into the same {chainId, baseToken:{symbol,address,name}, priceUsd}
    // pair shape /api/dexscreener/search returns, so _pickCallToken() and the
    // row renderer above need no special-casing for where a result came from.
    var pairs = [{chainId: info.chain, priceUsd: info.price, baseToken: {symbol: info.symbol, address: info.address || addr, name: info.name}}];
    dd.innerHTML = _callDdRowsHtml(pairs, chainLbls);
    window._callDdPairs = pairs;
  })
  .catch(function(){ dd.innerHTML='<div class="call-dd-row" style="cursor:default;color:var(--red)">Search failed</div>'; });
}

function _pickCallToken(idx){
  var p = window._callDdPairs[idx];
  if(!p) return;
  var sym = (p.baseToken&&p.baseToken.symbol)||'?';
  _callSelected = {mint: (p.baseToken&&p.baseToken.address)||'', symbol: sym};
  document.getElementById('call-search-input').value = sym;
  document.getElementById('call-dropdown').style.display = 'none';
  document.getElementById('call-submit-btn').disabled = false;
}

async function _submitCall(){
  if(!_callSelected) return;
  var btn = document.getElementById('call-submit-btn');
  var msg = document.getElementById('call-msg');
  btn.disabled = true;
  msg.textContent = '';
  msg.className = 'call-msg';
  try{
    var r = await fetch('/api/calls', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-CSRF-Token':_callsCsrfToken},
      body: JSON.stringify({mint: _callSelected.mint})
    });
    var d = await r.json();
    if(d.ok){
      msg.textContent = 'Call placed on $'+d.symbol+' at '+_fmtCallPrice(d.price)+'. '+d.calls_left_today+' call(s) left today.';
      msg.className = 'call-msg ok';
      document.getElementById('call-search-input').value = '';
      _callSelected = null;
      _loadCallsList();
    } else {
      msg.textContent = d.msg || 'Could not place call.';
      msg.className = 'call-msg err';
    }
  }catch(e){
    msg.textContent = 'Network error — try again.';
    msg.className = 'call-msg err';
  }
  btn.disabled = false;
}

document.getElementById('call-search-input').addEventListener('input', _callSearchInput);
document.addEventListener('click', function(e){
  var dd = document.getElementById('call-dropdown');
  var inp = document.getElementById('call-search-input');
  if(dd && !dd.contains(e.target) && e.target !== inp) dd.style.display = 'none';
});

_loadCallsList();
</script>

<script>
// Standalone pages have no SPA re-init to fall back on, so a bfcache
// restore (e.g. via the back button) would otherwise show whatever was
// on screen when the user navigated away -- stale balance, stale trades,
// stale unread counts. Force a real reload so the page is always fresh.
window.addEventListener('pageshow', function(e){
  if(e.persisted) location.reload();
});
</script>


<script>
/* Safe auto-refresh — every 60s, but skipped while the person is actively
   typing (focused input/textarea/contenteditable), has a modal or drawer
   open (this codebase consistently locks body scroll while one is open —
   see mn-drawer, token-detail panel, etc.), or interacted in the last 20s. */
(function(){
  var REFRESH_INTERVAL_MS = 60000;
  var IDLE_GRACE_MS       = 20000;
  var _lastInteraction = Date.now();
  ['mousedown', 'keydown', 'touchstart', 'scroll'].forEach(function(evt){
    document.addEventListener(evt, function(){ _lastInteraction = Date.now(); }, {passive: true});
  });
  function _isTypingOrFocused(){
    var el = document.activeElement;
    if(!el) return false;
    var tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable === true;
  }
  function _modalOpen(){
    return document.body.style.overflow === 'hidden';
  }
  function _safeCall(fn){
    try{ if(typeof fn === 'function') fn(); }catch(e){}
  }
  setInterval(function(){
    if(document.hidden) return;
    if(_isTypingOrFocused()) return;
    if(_modalOpen()) return;
    if(Date.now() - _lastInteraction < IDLE_GRACE_MS) return;
    _safeCall(window.fetchState);
    _safeCall(window._loadRightRail);
    _safeCall(window._botFetchStatus);
    _safeCall(window._refreshOnlineCount);
  }, REFRESH_INTERVAL_MS);
})();
</script>
<script src="/static/pull-to-refresh.js?v={{ app_version }}"></script>
<script>initPullToRefresh({ onRefresh: _loadCallsList });</script>
