<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="client-secret" content="{{ client_secret }}">
<title>Live Market — OrcAgent</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OrcAgent">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<style>
:root{--bg:#0a0b0e;--bg2:#101216;--bg3:#16191f;--bg4:#21252c;--accent:#f7b955;--text:#eef1f5;--muted:#565d68;--green:#3ad29b;--red:#ff4d6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}

/* header */
.lm-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bg3)}
.lm-header-title-wrap{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.lm-header-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:6px}
.lm-header-subtitle{font-size:10px;color:var(--muted);white-space:nowrap;font-family:'JetBrains Mono',monospace}
.lm-back{text-decoration:none;color:var(--muted);font-size:11px;white-space:nowrap;transition:color .15s;flex-shrink:0}
.lm-back:hover{color:var(--text)}

/* scanning pill */
.lm-scanning-pill{display:flex;align-items:center;gap:5px;background:rgba(58,210,155,.1);border-radius:20px;padding:5px 11px;font-size:10px;font-weight:700;color:var(--green);letter-spacing:.06em;flex-shrink:0;white-space:nowrap}
.lm-scan-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:scanBlink 1.4s ease-in-out infinite;flex-shrink:0}
@keyframes scanBlink{0%,100%{opacity:1}50%{opacity:.25}}

/* watchlist toggle (replaces the old ★ Watchlist tab) */
.lm-watchlist-toggle{margin-left:auto;flex-shrink:0;background:var(--bg2);border:1px solid var(--bg4);color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.lm-watchlist-toggle:hover{color:var(--text);border-color:var(--bg3)}
.lm-watchlist-toggle.active{background:rgba(247,185,85,.12);color:var(--accent);border-color:rgba(247,185,85,.25)}

/* filter chips + client-side search (drives which tab-data is fetched, plus a pure client-side sort/filter) */
.lm-chips-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;position:sticky;top:56px;z-index:20;background:var(--bg);border-bottom:1px solid var(--bg3);flex-wrap:wrap}
.lm-chips{display:flex;gap:6px;flex-wrap:wrap}
.lm-chip{padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;transition:all .15s;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lm-chip:hover{color:var(--text);border-color:var(--bg3)}
.lm-chip.active{background:rgba(247,185,85,.12);color:var(--accent);border-color:rgba(247,185,85,.25)}
.lm-chip-search-wrap{position:relative;flex:1;max-width:220px;min-width:140px}
.lm-chip-search{width:100%;background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:7px 12px 7px 30px;color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .15s}
.lm-chip-search:focus{border-color:var(--accent)}
.lm-chip-search::placeholder{color:var(--muted)}
.lm-chip-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:13px}

/* table wrapper */
.lm-table-wrap{background:var(--bg2);border:1px solid var(--bg3);border-radius:16px;overflow:hidden;margin:16px}
.lm-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}

/* table */
.lm-table{width:100%;border-collapse:collapse;table-layout:auto;min-width:840px}
.lm-table thead th{padding:12px 14px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--bg3);white-space:nowrap;text-align:right;background:var(--bg2)}
.lm-table thead th:first-child{text-align:center;padding-left:16px;width:36px}
.lm-table thead th.th-act{text-align:center}
.lm-table tbody tr{border-bottom:1px solid var(--bg3);transition:background .15s;cursor:pointer}
.lm-table tbody tr:last-child{border-bottom:none}
.lm-table tbody tr:hover{background:#14171c}
.lm-table tbody td{padding:0 14px;height:60px;font-size:13px;white-space:nowrap;text-align:right;vertical-align:middle;color:var(--muted)}
.lm-table tbody td:first-child{text-align:center;padding-left:16px}
.lm-table thead th.th-tok,
.lm-table tbody td.lm-tok-td{text-align:left;padding-left:8px}
.lm-price-cell{color:var(--text);font-weight:700}
.td-act{text-align:center}

/* sparkline (LAST 24H column) */
.lm-sparkline{display:flex;align-items:flex-end;justify-content:flex-end;gap:2px;height:28px}
.lm-spark-bar{width:5px;min-height:2px;border-radius:2px}

/* token cell */
.lm-tok-cell{display:flex;align-items:center;gap:10px}
.lm-watch-star{background:none;border:none;color:var(--bg4,#21252c);font-size:15px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;transition:color .15s}
.lm-watch-star:hover{color:#565d68}
.lm-watch-star.active{color:#f7b955}
.lm-tok-logo{width:36px;height:36px;border-radius:10px;object-fit:cover;flex-shrink:0}
.lm-tok-logo-ph{width:36px;height:36px;border-radius:10px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
.lm-tok-name{font-size:13px;font-weight:700;color:var(--text)}
.lm-tok-sym{font-size:11px;color:var(--muted);margin-top:2px}

/* featured/promoted row — union with the regular table, not a separate widget */
.lm-row-featured{background:rgba(247,185,85,.06)}
.lm-row-featured:hover{background:rgba(247,185,85,.1)}
.lm-featured-star{color:var(--accent)!important;font-size:14px}
.lm-featured-tag{font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#0a0b0e;background:var(--accent);border-radius:4px;padding:2px 5px;flex-shrink:0}

/* price change */
.chg-up{color:var(--green);font-weight:700}
.chg-dn{color:var(--red);font-weight:700}
.chg-fl{color:var(--muted)}

/* trade button */
.lm-btn-trade{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;border:none;border-radius:10px;padding:8px 18px;cursor:pointer;transition:opacity .15s;background:var(--accent);color:#0a0b0e;white-space:nowrap}
.lm-btn-trade:hover{opacity:.85}
.lm-btn-trade:disabled{opacity:.35;cursor:default}

/* inline trade dropdown */
.lm-drop-row td{padding:0;border-bottom:1px solid var(--bg3)}
.lm-drop-inner{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg)}
.lm-drop-label{font-size:11px;color:var(--muted);white-space:nowrap}
.lm-drop-input{width:80px;background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:5px 8px;color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;text-align:center;outline:none;-moz-appearance:textfield;transition:border-color .15s}
.lm-drop-input:focus{border-color:var(--accent)}
.lm-drop-input::-webkit-inner-spin-button,.lm-drop-input::-webkit-outer-spin-button{-webkit-appearance:none}
.lm-drop-confirm{background:var(--accent);color:#0a0b0e;border:none;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:opacity .15s}
.lm-drop-confirm:hover{opacity:.85}
.lm-drop-confirm:disabled{opacity:.35;cursor:default}
.lm-drop-sell-btn{background:var(--bg4);color:var(--red);border:1px solid rgba(255,77,106,.25);border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s}
.lm-drop-sell-btn:hover{background:rgba(255,77,106,.1)}
.lm-drop-cancel{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace;padding:5px 8px;transition:color .15s}
.lm-drop-cancel:hover{color:var(--text)}

/* row flash */
@keyframes flashGreen{0%{background:rgba(58,210,155,.15)}100%{background:transparent}}
@keyframes flashRed  {0%{background:rgba(255,77,106,.15)}100%{background:transparent}}
.flash-green{animation:flashGreen 1.2s ease-out forwards}
.flash-red  {animation:flashRed   1.2s ease-out forwards}

/* status / loading */
.lm-status-row td{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
.lm-spinner-ring{width:24px;height:24px;border:2px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite;display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* token detail modal — Focus / Terminal (see PROMPT.md Live Market + Token Detail spec) */
#lm-token-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.lm-modal-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:18px;width:100%;max-width:900px;position:relative}
.lm-modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:color .15s;font-family:system-ui,sans-serif;z-index:2}
.lm-modal-close:hover{color:var(--text)}
@keyframes tcSpin{to{transform:rotate(360deg)}}

/* header: token tile, name/ticker, chain badge, LIVE dot, Focus/Terminal toggle */
.lmtd-header{display:flex;align-items:center;gap:12px;padding:18px 52px 16px 20px;border-bottom:1px solid var(--bg3)}
.lmtd-logo{width:40px;height:40px;border-radius:12px;object-fit:cover;flex-shrink:0}
.lmtd-logo-ph{width:40px;height:40px;border-radius:12px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0}
.lmtd-title-wrap{flex:1;min-width:0}
.lmtd-name{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmtd-chain-badge{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#0a0b0e;background:rgba(58,210,155,.9);border-radius:5px;padding:2px 6px;flex-shrink:0}
.lmtd-live-dot-wrap{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--green);text-transform:uppercase;flex-shrink:0}
.lmtd-live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:scanBlink 1.4s ease-in-out infinite}
.lmtd-sym{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.lmtd-layout-toggle{display:flex;gap:2px;background:var(--bg3);border-radius:10px;padding:3px;flex-shrink:0}
.lmtd-layout-btn{padding:6px 14px;font-size:11px;font-weight:700;border:none;background:none;color:var(--muted);border-radius:8px;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase}
.lmtd-layout-btn.active{background:var(--bg2);color:var(--accent)}

/* shared: price hero + timeframe tabs */
.lmtd-hero{padding:16px 20px 0}
.lmtd-hero-price{font-size:30px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace}
.lmtd-hero-chg{font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;margin-top:2px}
.lmtd-tf-tabs{display:flex;gap:6px;padding:14px 20px}
.lmtd-tf-btn{padding:6px 13px;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;transition:all .15s;font-family:'JetBrains Mono',monospace}
.lmtd-tf-btn:hover{color:var(--text)}
.lmtd-tf-btn.active{background:rgba(247,185,85,.12);color:var(--accent);border-color:rgba(247,185,85,.25)}

/* candlestick chart (LightweightCharts, real OHLC via /api/chart/<mint>) */
.lmtd-chart-wrap{padding:0 20px}
.lmtd-chart-container{width:100%;height:340px;position:relative;background:var(--bg3);border-radius:10px;overflow:hidden}
.lmtd-chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:var(--bg3)}

/* Focus layout: chart + 5-tile stat row + full-width trade CTA */
.lmtd-stats-focus{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:16px 20px}
.lmtd-trade-cta{margin:4px 20px 20px}
.lmtd-trade-cta-btn{width:100%;background:var(--accent);color:#0a0b0e;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:opacity .15s}
.lmtd-trade-cta-btn:hover{opacity:.88}

/* Terminal layout: chart (65%) + Buy/Sell sidebar (35%) */
.lmtd-terminal{display:flex;gap:16px;padding:0 20px 20px;align-items:flex-start}
.lmtd-terminal-chart{flex:0 0 65%;min-width:0}
.lmtd-terminal-side{flex:1;min-width:0;background:var(--bg3);border-radius:12px;padding:14px}
.lmtd-side-tabs{display:flex;gap:4px;background:var(--bg2);border-radius:9px;padding:3px;margin-bottom:12px}
.lmtd-side-tab{flex:1;padding:8px 0;font-size:12px;font-weight:700;border:none;background:none;border-radius:7px;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.lmtd-side-tab.buy.active{background:rgba(58,210,155,.14);color:var(--green)}
.lmtd-side-tab.sell.active{background:rgba(255,77,106,.14);color:var(--red)}
.lmtd-sol-input-wrap{position:relative;margin-bottom:8px}
.lmtd-sol-input{width:100%;background:var(--bg2);border:1px solid var(--bg4);border-radius:10px;padding:11px 50px 11px 12px;color:var(--text);font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .15s;-moz-appearance:textfield}
.lmtd-sol-input:focus{border-color:var(--accent)}
.lmtd-sol-input-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-weight:700}
.lmtd-pct-row{display:flex;gap:6px;margin-bottom:12px}
.lmtd-pct-btn{flex:1;background:var(--bg2);border:1px solid var(--bg4);color:var(--muted);border-radius:8px;padding:7px 0;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace}
.lmtd-pct-btn:hover{color:var(--text);border-color:var(--bg3)}
.lmtd-action-btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:opacity .15s;margin-bottom:14px}
.lmtd-action-btn.buy{background:var(--green);color:#06210f}
.lmtd-action-btn.sell{background:var(--red);color:#2a0a0a}
.lmtd-action-btn:hover{opacity:.88}
.lmtd-action-btn:disabled{opacity:.4;cursor:default}
.lmtd-compact-stats{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--bg4);padding-top:12px}
.lmtd-compact-stat-row{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.lmtd-compact-stat-label{color:var(--muted)}
.lmtd-compact-stat-value{color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace}

/* shared: stat tile + buys/sells ratio bar */
.lmtd-stat-tile{background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:10px}
.lmtd-stat-tile-label{font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-family:'JetBrains Mono',monospace}
.lmtd-stat-tile-value{font-size:13px;font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace}
.lmtd-ratio-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--bg4)}
.lmtd-ratio-buy{background:var(--green)}
.lmtd-ratio-sell{background:var(--red)}

/* ── MOBILE BACK BAR ── */
.mobile-back-bar{display:none}
@media(max-width:767px){
  .mobile-back-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;z-index:30;background:#101216;border-bottom:1px solid #16191f}
  .mobile-back-btn{color:#f7b955;font-size:15px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .mobile-page-title{font-size:16px;font-weight:600;color:#eef1f5;font-family:inherit}
}
/* mobile — CSS grid layout replaces table layout entirely */
@media(max-width:767px){
  html,body{overflow-x:hidden}
  .lm-modal-close{min-width:44px;min-height:44px}
  .lm-header{display:none!important}
  .mobile-back-bar{height:52px}
  .lm-chips-row{top:52px}
  .lm-table-wrap{margin:8px}
  .col-hide{display:none!important}
  .lm-scanning-pill .lm-scan-label{display:none}

  /* Override table display — each row becomes a CSS grid */
  .lm-table-scroll{overflow-x:hidden}
  .lm-table{display:block;width:100%;min-width:0}
  .lm-table thead{display:none}
  .lm-table tbody{display:block}
  .lm-table tbody tr{
    display:grid;
    grid-template-columns:20px 48px 1fr 90px 70px 80px;
    align-items:center;
    min-height:56px;
    border-bottom:1px solid var(--bg3);
    padding:0 6px;
    cursor:pointer;
    transition:background .15s;
  }
  .lm-table tbody tr:not(.lm-drop-row):hover{background:#14171c}
  .lm-table tbody td{
    display:block;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    padding:8px 4px;
    min-width:0;
    text-align:right;
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
  }

  /* RANK cell — its own narrow slot */
  .lm-rank-cell{
    text-align:center;
    padding:8px 0;
    color:var(--muted);
    font-weight:600;
    font-size:11px;
  }

  /* TOKEN cell spans logo column (48px) + name column (1fr) */
  .lm-table tbody td.lm-tok-td{
    grid-column:span 2;
    text-align:left;
    padding-left:2px;
    padding-right:6px;
    font-family:inherit;
  }

  /* Status rows and dropdown rows span all 6 columns */
  .lm-table tbody tr.lm-status-row td:first-child,
  .lm-table tbody tr.lm-drop-row td:first-child{
    grid-column:1 / -1;
    white-space:normal;
    text-align:center;
    padding:0;
    height:auto;
    min-height:0;
  }
  .lm-table tbody tr.lm-drop-row{min-height:auto}

  /* ── Token cell: logo + stacked name/ticker ── */
  .lm-tok-cell{
    display:flex;align-items:center;gap:8px;width:100%;overflow:hidden;min-width:0;
  }
  .lm-tok-logo,.lm-tok-logo-ph{
    width:36px;height:36px;font-size:10px;flex-shrink:0;border-radius:9px;
  }
  .lm-tok-cell>div{
    display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0;flex:1;
  }
  .lm-tok-name{
    font-size:14px;font-weight:600;color:var(--text);font-family:'JetBrains Mono',monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:110px;
  }
  .lm-tok-sym{
    font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;
  }

  /* ── Price cell ── */
  .lm-price-cell{font-size:12px;font-weight:700;color:var(--text);text-align:right}

  /* ── 24H% cell ── */
  .td-chg24{font-size:13px;font-weight:700;text-align:right}

  /* ── Trade cell ── */
  .td-act{text-align:center;padding:4px 2px}
  .lm-btn-trade{
    min-height:44px;width:60px;padding:0;
    font-size:11px;font-weight:700;border-radius:10px;flex-shrink:0;
    background:var(--accent);color:#0a0b0e;
  }

  /* ── Dropdown row ── */
  .lm-drop-inner{flex-wrap:wrap;gap:6px;padding:8px 10px}

  /* ── Token detail modal: stack Terminal, shrink chart, 2-col stat grid ── */
  #lm-token-modal{padding:0;align-items:stretch}
  .lm-modal-card{max-width:100%;border-radius:0;min-height:100vh}
  .lmtd-hero-price{font-size:24px}
  .lmtd-chart-container{height:220px}
  .lmtd-stats-focus{grid-template-columns:repeat(2,1fr)}
  .lmtd-terminal{flex-direction:column}
  .lmtd-terminal-chart{flex:1 1 auto;width:100%}
}

/* small phones — free up the token-name column from the 767px fixed grid */
@media(max-width:400px){
  .lm-table tbody tr{
    grid-template-columns:14px 32px 1fr 74px 56px 64px;
  }
  .lm-tok-name{
    max-width:none;
  }
  .lm-btn-trade{
    width:48px;
  }
  .lm-price-cell{
    font-size:11px;
  }
  .td-chg24{
    font-size:11px;
  }
}

::-webkit-scrollbar{height:4px;width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
</style>
</head>
<body>

<div class="mobile-back-bar">
  <button onclick="location.href='/'" class="mobile-back-btn">← Back</button>
  <span class="mobile-page-title">Live Market</span>
</div>

<header class="lm-header">
  <a class="lm-back" href="/">← Back</a>
  <div class="lm-header-title-wrap">
    <div class="lm-header-title">Live Market</div>
    <div class="lm-header-subtitle" id="lm-header-subtitle">Scanner running · 0 tokens tracked · refreshes every 15s</div>
  </div>
  <div class="lm-scanning-pill">
    <span class="lm-scan-dot"></span>
    <span class="lm-scan-label">SCANNING</span>
  </div>
  <button class="lm-watchlist-toggle" id="lm-watchlist-toggle" onclick="_lmToggleWatchlistView()" title="Watchlist">★</button>
</header>

<div class="lm-chips-row">
  <div class="lm-chips" id="lm-chips">
    <button class="lm-chip active" id="chip-trending" onclick="_lmSetChip('trending')">Trending</button>
    <button class="lm-chip"        id="chip-gainers"  onclick="_lmSetChip('gainers')">Gainers</button>
    <button class="lm-chip"        id="chip-new"      onclick="_lmSetChip('new')">New</button>
    <button class="lm-chip"        id="chip-volume"   onclick="_lmSetChip('volume')">Volume</button>
  </div>
  <div class="lm-chip-search-wrap">
    <span class="lm-chip-search-icon">⌕</span>
    <input class="lm-chip-search" id="lm-chip-search" type="text" placeholder="Filter loaded tokens…" autocomplete="off" oninput="_lmChipSearchDebounce(this.value)">
  </div>
</div>

<div id="lm-table-wrap" class="lm-table-wrap"></div>

<!-- token detail modal (Focus / Terminal — see PROMPT.md spec) -->
<div id="lm-token-modal" onclick="if(event.target===this)_lmtdCloseModal()">
  <div class="lm-modal-card" onclick="event.stopPropagation()">
    <button class="lm-modal-close" onclick="_lmtdCloseModal()">✕</button>
    <div id="lm-modal-body"></div>
  </div>
</div>

<script>
'use strict';

/* ── state ── */
var _activeTab   = 'trending';
var _cache       = {};
var _pairs       = [];
var _lmWatchSet  = new Set();
_lmLoadWatchSet();
function _lmLoadWatchSet(){
  fetch('/api/watchlist', {credentials:'include'}).then(function(r){return r.json();}).then(function(d){
    if(d.ok) _lmWatchSet = new Set(d.tokens.map(function(t){ return t.token_address; }));
  }).catch(function(){});
}
function _toggleWatch(btn, addr, sym){
  var isWatched = _lmWatchSet.has(addr);
  var method = isWatched ? 'DELETE' : 'POST';
  var _cs   = (typeof _lmClientSecret!=='undefined'?_lmClientSecret:'')||(document.querySelector('meta[name="client-secret"]')||{}).content||'';
  var _csrf = (document.querySelector('meta[name="csrf-token"]')||{}).content||'';
  var headers = Object.assign({
    'Content-Type':'application/json',
    'X-CSRF-Token':_csrf,
    'X-CSRFToken':_csrf
  }, _cs ? {'X-API-Shared-Secret':_cs} : {});
  fetch('/api/watchlist/'+encodeURIComponent(addr), {method:method, credentials:'include', headers:headers, body: method==='POST' ? JSON.stringify({symbol: sym}) : undefined})
    .then(function(r){return r.json().then(function(d){ return {status:r.status, body:d}; }); })
    .then(function(res){
      var d = res.body;
      if(!d.ok){
        if(res.status===401) _toast('Connect your wallet to use the watchlist', false);
        else _toast(d.msg||'Could not update watchlist', false);
        console.error('[watchlist] toggle failed', res.status, d);
        return;
      }
      if(isWatched){ _lmWatchSet.delete(addr); btn.classList.remove('active'); btn.title='Add to watchlist'; }
      else { _lmWatchSet.add(addr); btn.classList.add('active'); btn.title='Remove from watchlist'; _toast('Added to watchlist ★', true); }
      if(_activeTab==='watchlist' && isWatched) _loadTab('watchlist');
    }).catch(function(e){
      console.error('[watchlist] network error', e);
      _toast('Network error — could not update watchlist', false);
    });
}

/* ── tab switching ── */
function _setTab(tab){
  _activeTab = tab;
  document.getElementById('lm-chip-search').value = '';
  _lmChipQuery = '';
  if(_cache[tab]){ _renderTable(_cache[tab]); }
  else { _loadTab(tab); }
}

/* ── filter chips drive both the fetch (trending/gainers/new — reuse the
   existing per-tab fetchers via _setTab, unchanged) and, for volume, a pure
   client-side re-sort of whatever's already loaded (see _lmSortedPairs). ── */
function _lmSetChip(chip){
  _lmChipFilter = chip;
  document.getElementById('lm-watchlist-toggle').classList.remove('active');
  ['trending','gainers','new','volume'].forEach(function(c){
    document.getElementById('chip-'+c).classList.toggle('active', c===chip);
  });
  if(chip === 'volume'){ _lmApplyChipFilter(); }
  else { _setTab(chip); }
}

function _lmToggleWatchlistView(){
  var btn = document.getElementById('lm-watchlist-toggle');
  if(btn.classList.contains('active')){
    btn.classList.remove('active');
    _lmSetChip('trending');
  } else {
    btn.classList.add('active');
    ['trending','gainers','new','volume'].forEach(function(c){
      document.getElementById('chip-'+c).classList.remove('active');
    });
    _setTab('watchlist');
  }
}

/* ── data loading ── */
async function _fetchTabData(tab){
  if(tab==='trending')  return await _fetchTrending();
  else if(tab==='new')  return await _fetchNew();
  else if(tab==='losers') return await _fetchLosers();
  else if(tab==='watchlist') return await _fetchWatchlist();
  else                   return await _fetchGainers();
}

async function _loadTab(tab){
  _setLoading();
  try{
    var pairs = await _fetchTabData(tab);
    _cache[tab] = pairs;
    _renderTable(pairs);
  }catch(e){
    _setError('Failed to load data');
  }
}

async function _silentRefreshTab(tab){
  try{
    var pairs = await _fetchTabData(tab);
    _cache[tab] = pairs;
    _renderTable(pairs);
  }catch(e){
    console.error('[live-market] silent refresh failed', e);
  }
}

async function _fetchTrending(){
  var r     = await fetch('/api/dexscreener/token-boosts');
  var items = await r.json();
  var solana = (Array.isArray(items)?items:[]).filter(function(i){ return i.chainId==='solana'; }).slice(0,50);
  if(!solana.length) return [];
  var iconMap = {};
  solana.forEach(function(i){ iconMap[i.tokenAddress]=i.icon; });
  var addresses = solana.map(function(i){ return i.tokenAddress; }).join(',');
  var pr = await fetch('/api/dexscreener/tokens/'+addresses);
  var pd = await pr.json();
  return _dedupeByAddress(pd.pairs||[], iconMap);
}

async function _fetchNew(){
  var r     = await fetch('/api/dexscreener/token-profiles');
  var items = await r.json();
  var solana = (Array.isArray(items)?items:[]).filter(function(i){ return i.chainId==='solana'; }).slice(0,50);
  if(!solana.length) return [];
  var iconMap = {};
  solana.forEach(function(i){ iconMap[i.tokenAddress]=i.icon; });
  var addresses = solana.map(function(i){ return i.tokenAddress; }).join(',');
  var pr = await fetch('/api/dexscreener/tokens/'+addresses);
  var pd = await pr.json();
  return _dedupeByAddress(pd.pairs||[], iconMap);
}

async function _fetchGainers(){
  var trending = await _fetchTrending();
  var fresh    = await _fetchNew();
  var merged   = trending.concat(fresh);
  merged.sort(function(a,b){
    var ac = a.priceChange&&a.priceChange.h24!=null?a.priceChange.h24:-Infinity;
    var bc = b.priceChange&&b.priceChange.h24!=null?b.priceChange.h24:-Infinity;
    return bc-ac;
  });
  return _dedupeByAddress(merged, {});
}

async function _fetchLosers(){
  var trending = await _fetchTrending();
  var fresh    = await _fetchNew();
  var merged   = trending.concat(fresh);
  merged.sort(function(a,b){
    var ac = a.priceChange&&a.priceChange.h24!=null?a.priceChange.h24:Infinity;
    var bc = b.priceChange&&b.priceChange.h24!=null?b.priceChange.h24:Infinity;
    return ac-bc;
  });
  return _dedupeByAddress(merged, {});
}

async function _fetchWatchlist(){
  var wr = await fetch('/api/watchlist', {credentials:'include'});
  var wd = await wr.json();
  var addresses = (wd.ok ? wd.tokens : []).map(function(t){ return t.token_address; });
  if(!addresses.length) return [];
  var pr = await fetch('/api/dexscreener/tokens/'+addresses.join(','));
  var pd = await pr.json();
  return _dedupeByAddress(pd.pairs||[], {});
}

function _dedupeByAddress(pairs, iconMap){
  var trustedQuotes = ['SOL','USDC','USDT'];
  var byAddr = {};
  pairs.forEach(function(p){
    var addr = p.baseToken&&p.baseToken.address;
    if(!addr) return;
    (byAddr[addr] = byAddr[addr] || []).push(p);
  });

  var best = {};
  Object.keys(byAddr).forEach(function(addr){
    var group = byAddr[addr];
    var trusted = group.filter(function(p){
      return trustedQuotes.indexOf(p.quoteToken&&p.quoteToken.symbol) !== -1;
    });
    var pool = trusted.length ? trusted : group;
    var bestP = null, bestLiq = -1;
    pool.forEach(function(p){
      var liq = (p.liquidity&&p.liquidity.usd)||0;
      if(!bestP || liq > bestLiq){ bestP = p; bestLiq = liq; }
    });
    best[addr] = bestP;
  });

  var out = Object.keys(best).map(function(addr){
    var p = best[addr];
    if(iconMap[addr]&&!(p.info&&p.info.imageUrl))
      p = Object.assign({},p,{_icon:iconMap[addr]});
    return p;
  });
  return out.slice(0,50);
}

/* ── featured/promoted tokens (paid placement, /api/promote/featured) ──
   Restored from the pre-8fa5796 header widget, but placed as a marked row
   at the top of the table (union with whatever the active chip/search
   shows) instead of a separate floating header banner — see PROMPT.md
   spec, which has no room for a standalone featured widget in the new
   header. Independent of which chip/tab is active: fetched once at page
   load, not tied to the Trending fetch like before. */
var _featuredPairs   = [];
var _lmFeaturedIdx   = 0;
var _lmFeaturedTimer = null;

async function _fetchFeaturedMarket(){
  var fr = await fetch('/api/promote/featured?placement=market');
  var fd = await fr.json();
  var promos = (fd && fd.ok && fd.promotions) || [];
  var mints = promos.map(function(p){ return p.token_mint; }).filter(Boolean);
  if(!mints.length) return [];
  var pr = await fetch('/api/dexscreener/tokens/'+mints.join(','));
  var pd = await pr.json();
  var pairs = _dedupeByAddress(pd.pairs||[], {});
  return pairs.map(function(p){ return Object.assign({}, p, {isFeatured:true}); });
}

function _lmStartFeaturedRotation(){
  if(_lmFeaturedTimer){ clearInterval(_lmFeaturedTimer); _lmFeaturedTimer = null; }
  if(_featuredPairs.length > 1){
    _lmFeaturedTimer = setInterval(function(){
      _lmFeaturedIdx = (_lmFeaturedIdx + 1) % _featuredPairs.length;
      _lmApplyChipFilter(); // re-render so the featured row picks up the next promotion
    }, 10000);
  }
}

async function _lmInitFeatured(){
  _featuredPairs = await _fetchFeaturedMarket().catch(function(){ return []; });
  _lmFeaturedIdx = 0;
  _lmStartFeaturedRotation();
  _lmApplyChipFilter(); // reflect the featured row as soon as it's known, don't wait for the next table refresh
}

/* Same 8-column shape as a regular row (built independently of _rowHtml
   rather than post-processing its output) so it lines up visually, with a
   FEATURED tag + star instead of a rank number. idx -1 keeps the inline
   buy/sell dropdown (_openBuyDrop) working without colliding with any real
   row's index. */
function _lmFeaturedRow(p){
  var sym  = (p.baseToken&&p.baseToken.symbol)||'?';
  var name = (p.baseToken&&p.baseToken.name)||sym;
  var addr = (p.baseToken&&p.baseToken.address)||'';
  var imgUrl = (p.info&&p.info.imageUrl)||p._icon||'';

  var logo = imgUrl
    ? '<img class="lm-tok-logo" src="'+_esc(imgUrl)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
      +'<div class="lm-tok-logo-ph" style="display:none">'+_esc(sym.slice(0,2))+'</div>'
    : '<div class="lm-tok-logo-ph">'+_esc(sym.slice(0,2))+'</div>';

  var price = _fmtPrice(p.priceUsd);
  var vol   = _fmtNum(p.volume&&p.volume.h24!=null?p.volume.h24:null);
  var mcap  = _fmtNum(p.marketCap || p.fdv || null);
  var chg24 = p.priceChange&&p.priceChange.h24!=null?p.priceChange.h24:null;

  return '<tr id="lm-row--1" class="lm-row lm-row-featured" data-idx="-1" data-sym="'+_esc(sym)+'" data-addr="'+_esc(addr)+'" data-pair="'+_esc(p.pairAddress||'')+'">'
    +'<td class="lm-rank-cell lm-featured-star" title="Featured">★</td>'
    +'<td class="lm-tok-td">'
      +'<div class="lm-tok-cell">'
        +'<span class="lm-featured-tag">FEATURED</span>'
        +logo
        +'<div>'
          +'<div class="lm-tok-name">'+_esc(name)+'</div>'
          +'<div class="lm-tok-sym">$'+_esc(sym)+'</div>'
        +'</div>'
      +'</div>'
    +'</td>'
    +'<td class="lm-price-cell">'+price+'</td>'
    +_chgCell(chg24,'td-chg24')
    +'<td class="col-hide">'+vol+'</td>'
    +'<td class="col-hide">'+mcap+'</td>'
    +'<td class="col-hide">'+_sparkline(p)+'</td>'
    +'<td class="td-act">'
      +'<button class="lm-btn-trade" data-action="trade" data-idx="-1" data-sym="'+_esc(sym)+'" data-pair="'+_esc(p.pairAddress||'')+'" data-addr="'+_esc(addr)+'">Trade</button>'
    +'</td>'
    +'</tr>';
}


/* thead — 8 columns */
var _THEAD = '<thead><tr>'
  +'<th class="th-rank">#</th>'
  +'<th class="th-tok">TOKEN</th>'
  +'<th class="th-price">PRICE</th>'
  +'<th class="th-chg24">24H</th>'
  +'<th class="col-hide">VOLUME</th>'
  +'<th class="col-hide">MARKET CAP</th>'
  +'<th class="col-hide">LAST 24H</th>'
  +'<th class="th-act">TRADE</th>'
  +'</tr></thead>';

function _buildTable(tbodyRows){
  return '<div class="lm-table-scroll"><table class="lm-table">'+_THEAD+'<tbody id="lm-grid">'+tbodyRows+'</tbody></table></div>';
}

/* ── render table ── */
var _lmTableDelegated = false;
function _lmBindTableEvents(wrap){
  if(_lmTableDelegated) return;
  _lmTableDelegated = true;
  wrap.addEventListener('click', function(event){
    var watchBtn = event.target.closest('.lm-watch-star');
    if(watchBtn){
      event.stopPropagation();
      _toggleWatch(watchBtn, watchBtn.dataset.addr, watchBtn.dataset.sym);
      return;
    }
    var tradeBtn = event.target.closest('.lm-btn-trade');
    if(tradeBtn){
      event.stopPropagation();
      _openBuyDrop(parseInt(tradeBtn.dataset.idx,10), tradeBtn.dataset.sym, tradeBtn.dataset.pair, tradeBtn.dataset.addr, tradeBtn);
      return;
    }
    var row = event.target.closest('.lm-row');
    if(row) _rowClick(event, row.dataset.sym, row.dataset.addr);
  });
}
function _renderTable(pairs){
  _closeBuyDrop();
  _pairs = pairs;
  var subtitle = document.getElementById('lm-header-subtitle');
  if(subtitle) subtitle.textContent = 'Scanner running · '+pairs.length+' tokens tracked · refreshes every 15s';
  _lmBindTableEvents(document.getElementById('lm-table-wrap'));
  _lmApplyChipFilter();
}

/* ── filter chips + client-side search ──
   Re-sorts/filters the already-fetched _pairs array in place, client-side,
   no new fetch. Composes with whichever tab is active: switching tabs
   resets the chip back to 'trending' (see _setTab). Rank (#) is recomputed
   from the filtered/sorted array's own index, not the original _pairs
   index — reuses _rowHtml/_sparkline unchanged. */
var _lmChipFilter = 'trending';
var _lmChipQuery  = '';
var _lmChipTimer  = null;

function _lmChipSearchDebounce(q){
  clearTimeout(_lmChipTimer);
  _lmChipTimer = setTimeout(function(){
    _lmChipQuery = q.trim().toLowerCase();
    _lmApplyChipFilter();
  }, 300);
}

function _lmSortedPairs(){
  var arr = _pairs.slice();
  if(_lmChipFilter==='gainers'){
    arr.sort(function(a,b){
      var av = (a.priceChange&&a.priceChange.h24!=null) ? a.priceChange.h24 : -Infinity;
      var bv = (b.priceChange&&b.priceChange.h24!=null) ? b.priceChange.h24 : -Infinity;
      return bv-av;
    });
  } else if(_lmChipFilter==='new'){
    arr.sort(function(a,b){
      var av = a.pairCreatedAt || -Infinity;
      var bv = b.pairCreatedAt || -Infinity;
      return bv-av;
    });
  } else if(_lmChipFilter==='volume'){
    arr.sort(function(a,b){
      var av = (a.volume&&a.volume.h24!=null) ? a.volume.h24 : 0;
      var bv = (b.volume&&b.volume.h24!=null) ? b.volume.h24 : 0;
      return bv-av;
    });
  }
  /* 'trending' — leave in the order the active tab already fetched it */
  return arr;
}

function _lmChipMatchesQuery(p, q){
  var sym  = ((p.baseToken&&p.baseToken.symbol)||'').toLowerCase();
  var name = ((p.baseToken&&p.baseToken.name)||'').toLowerCase();
  return sym.indexOf(q)>=0 || name.indexOf(q)>=0;
}

function _lmApplyChipFilter(){
  var sorted   = _lmSortedPairs();
  var filtered = _lmChipQuery ? sorted.filter(function(p){ return _lmChipMatchesQuery(p,_lmChipQuery); }) : sorted;
  var wrap = document.getElementById('lm-table-wrap');
  var featuredPair = _featuredPairs.length ? _featuredPairs[_lmFeaturedIdx % _featuredPairs.length] : null;
  var showFeatured = featuredPair && (!_lmChipQuery || _lmChipMatchesQuery(featuredPair, _lmChipQuery));
  var featuredRowHtml = showFeatured ? _lmFeaturedRow(featuredPair) : '';
  if(!filtered.length){
    wrap.innerHTML = _buildTable(featuredRowHtml + '<tr class="lm-status-row"><td colspan="8">No tokens found</td></tr>');
    return;
  }
  wrap.innerHTML = _buildTable(featuredRowHtml + filtered.map(function(p,i){ return _rowHtml(p,i); }).join(''));
}

function _chgCell(v, extra){
  var x = extra ? ' '+extra : '';
  if(v==null) return '<td class="chg-fl'+x+'">—</td>';
  var s=(v>=0?'+':'')+v.toFixed(2)+'%';
  return '<td class="'+(v>=0?'chg-up':'chg-dn')+x+'">'+s+'</td>';
}

/* 4-point mini-bar sparkline from the 5m/1h/6h/24h change datapoints
   already returned per pair — colored by 24h direction, bar height by
   each point's magnitude relative to the largest of the four. */
function _sparkline(p){
  var pc = p.priceChange||{};
  var vals = [
    pc.m5 !=null?pc.m5 :0,
    pc.h1 !=null?pc.h1 :0,
    pc.h6 !=null?pc.h6 :0,
    pc.h24!=null?pc.h24:0
  ];
  var h24   = pc.h24!=null?pc.h24:0;
  var color = h24>=0 ? '#3ad29b' : '#ff4d6a';
  var maxAbs = Math.max.apply(null, vals.map(Math.abs)) || 1;
  var bars = vals.map(function(v){
    var pct = Math.max(10, Math.round(Math.abs(v)/maxAbs*100));
    return '<div class="lm-spark-bar" style="height:'+pct+'%;background:'+color+'"></div>';
  }).join('');
  return '<div class="lm-sparkline">'+bars+'</div>';
}

function _rowHtml(p, idx){
  var sym  = (p.baseToken&&p.baseToken.symbol)||'?';
  var name = (p.baseToken&&p.baseToken.name)||sym;
  var addr = (p.baseToken&&p.baseToken.address)||'';
  var imgUrl = (p.info&&p.info.imageUrl)||p._icon||'';

  var logo = imgUrl
    ? '<img class="lm-tok-logo" src="'+_esc(imgUrl)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
      +'<div class="lm-tok-logo-ph" style="display:none">'+_esc(sym.slice(0,2))+'</div>'
    : '<div class="lm-tok-logo-ph">'+_esc(sym.slice(0,2))+'</div>';

  var price = _fmtPrice(p.priceUsd);
  var vol   = _fmtNum(p.volume&&p.volume.h24!=null?p.volume.h24:null);
  var mcap  = _fmtNum(p.marketCap || p.fdv || null);
  var chg24 = p.priceChange&&p.priceChange.h24!=null?p.priceChange.h24:null;

  return '<tr id="lm-row-'+idx+'" class="lm-row" data-idx="'+idx+'" data-sym="'+_esc(sym)+'" data-addr="'+_esc(addr)+'" data-pair="'+_esc(p.pairAddress||'')+'">'
    +'<td class="lm-rank-cell">'+(idx+1)+'</td>'
    +'<td class="lm-tok-td">'
      +'<div class="lm-tok-cell">'
        +'<button class="lm-watch-star'+(_lmWatchSet.has(addr)?' active':'')+'" data-action="watch" data-addr="'+_esc(addr)+'" data-sym="'+_esc(sym)+'" title="'+(_lmWatchSet.has(addr)?'Remove from watchlist':'Add to watchlist')+'">★</button>'
        +logo
        +'<div>'
          +'<div class="lm-tok-name">'+_esc(name)+'</div>'
          +'<div class="lm-tok-sym">$'+_esc(sym)+'</div>'
        +'</div>'
      +'</div>'
    +'</td>'
    +'<td class="lm-price-cell">'+price+'</td>'
    +_chgCell(chg24,'td-chg24')
    +'<td class="col-hide">'+vol+'</td>'
    +'<td class="col-hide">'+mcap+'</td>'
    +'<td class="col-hide">'+_sparkline(p)+'</td>'
    +'<td class="td-act">'
      +'<button class="lm-btn-trade" data-action="trade" data-idx="'+idx+'" data-sym="'+_esc(sym)+'" data-pair="'+_esc(p.pairAddress||'')+'" data-addr="'+_esc(addr)+'">Trade</button>'
    +'</td>'
    +'</tr>';
}

function _rowClick(e, sym, addr){
  if(e.target.tagName==='BUTTON'||e.target.closest('button')) return;
  showTokenCard(sym, addr);
}

/* ── inline trade dropdown ── */
var _openDropIdx = -1;

function _openBuyDrop(idx, sym, pairAddr, tokenAddr, btn){
  if(_openDropIdx === idx){ _closeBuyDrop(); return; }
  _closeBuyDrop();
  _openDropIdx = idx;

  var dataRow = document.getElementById('lm-row-'+idx);
  if(!dataRow) return;

  var inputId = 'lm-drop-amt-'+idx;

  var tr = document.createElement('tr');
  tr.id = 'lm-drop-'+idx;
  tr.className = 'lm-drop-row';
  tr.innerHTML = '<td colspan="8">'
    +'<div class="lm-drop-inner">'
      +'<span class="lm-drop-label">Trade <strong style="color:#f7b955">$'+_esc(sym)+'</strong></span>'
      +'<span class="lm-drop-label">SOL:</span>'
      +'<input class="lm-drop-input" id="'+inputId+'" type="number" min="0.001" step="0.1" value="0.1" onclick="event.stopPropagation()">'
      +'<button class="lm-drop-confirm" id="lm-drop-confirm-'+idx+'" data-sym="'+_esc(sym)+'" data-pair="'+_esc(pairAddr)+'" data-addr="'+_esc(tokenAddr)+'">Buy</button>'
      +'<button class="lm-drop-sell-btn" id="lm-drop-sell-'+idx+'" data-sym="'+_esc(sym)+'" data-pair="'+_esc(pairAddr)+'" data-addr="'+_esc(tokenAddr)+'">Sell All</button>'
      +'<button class="lm-drop-cancel" onclick="event.stopPropagation();_closeBuyDrop()">✕</button>'
    +'</div>'
    +'</td>';
  var confirmBtn = tr.querySelector('#lm-drop-confirm-'+idx);
  confirmBtn.addEventListener('click', function(ev){
    ev.stopPropagation();
    _confirmBuy(idx, confirmBtn.dataset.sym, confirmBtn.dataset.pair, confirmBtn.dataset.addr);
  });
  var sellBtn = tr.querySelector('#lm-drop-sell-'+idx);
  sellBtn.addEventListener('click', function(ev){
    ev.stopPropagation();
    _quickSell(idx, sellBtn.dataset.sym, sellBtn.dataset.pair, sellBtn.dataset.addr, sellBtn);
  });

  dataRow.insertAdjacentElement('afterend', tr);
  setTimeout(function(){ var el=document.getElementById(inputId); if(el) el.focus(); }, 30);
}

function _closeBuyDrop(){
  if(_openDropIdx < 0) return;
  var el = document.getElementById('lm-drop-'+_openDropIdx);
  if(el) el.remove();
  _openDropIdx = -1;
}

async function _confirmBuy(idx, sym, pairAddr, tokenAddr){
  var inputEl    = document.getElementById('lm-drop-amt-'+idx);
  var confirmBtn = document.getElementById('lm-drop-confirm-'+idx);
  var amount     = parseFloat(inputEl ? inputEl.value : '0.1');
  if(!amount || amount <= 0){ _toast('Enter a valid SOL amount', false); return; }
  if(confirmBtn){ confirmBtn.textContent='…'; confirmBtn.disabled=true; }
  var ok = await _doTrade(sym, pairAddr, 'buy', amount, tokenAddr);
  _closeBuyDrop();
  if(ok){ _flashRow(idx, true);  _toast('Bought $'+sym, true); }
  else  { _flashRow(idx, false); }
}

async function _quickSell(idx, sym, pairAddr, tokenAddr, btn){
  var origHtml = btn ? btn.innerHTML : '';
  if(btn){ btn.innerHTML='…'; btn.disabled=true; }
  var ok = await _doTrade(sym, pairAddr, 'sell', 0, tokenAddr);
  if(btn){ btn.innerHTML=origHtml; btn.disabled=false; }
  _closeBuyDrop();
  if(ok){ _flashRow(idx, false); _toast('Sold $'+sym, true); }
}

/* shared trade fetch */
async function _doTrade(sym, pairAddr, side, amount, tokenAddr){
  try{
    var _cs   = _lmClientSecret||(document.querySelector('meta[name="client-secret"]')||{}).content||'';
    var _csrf = (document.querySelector('meta[name="csrf-token"]')||{}).content||_lmCsrf||'';
    var r = await fetch('/api/instant-trade',{
      method:'POST',
      credentials:'include',
      headers:Object.assign({
        'Content-Type':'application/json',
        'X-CSRF-Token':_csrf,
        'X-CSRFToken':_csrf,
        'X-Requested-With':'XMLHttpRequest'
      }, _cs ? {'X-API-Shared-Secret':_cs} : {}),
      body:JSON.stringify({symbol:sym, pair_address:pairAddr, side:side, amount_sol:amount, token_address:tokenAddr})
    });
    var d = await r.json();
    if(r.ok) return true;
    _toast((d.error||d.message||'Trade failed'), false);
    return false;
  }catch(e){
    _toast('Network error — trade not sent', false);
    return false;
  }
}

function _flashRow(idx, green){
  var row = document.getElementById('lm-row-'+idx);
  if(!row) return;
  row.classList.remove('flash-green','flash-red');
  void row.offsetWidth;
  row.classList.add(green ? 'flash-green' : 'flash-red');
}

var _lmtdPair       = null;
var _lmtdSymbol     = '';
var _lmtdLayout     = 'focus';
var _lmtdTf         = '5m';
var _lmtdSide       = 'buy';
var _lmtdSolBalance = 0;
var _lmtdChart      = null;
var _lmtdSeries     = null;
var _lmtdVolSeries  = null;
var _lmtdChartPromise = null; // in-flight/consumed /api/chart/ fetch, started in parallel with the pair-search
var _lmtdActiveMint = ''; // mint the modal is CURRENTLY open on — lets a late-arriving stale fetch recognize itself as stale
var _LMTD_TF_MAP    = {'1m':'1m','5m':'5m','15m':'15m','1H':'1h','4H':'4h','1D':'D'};
var _LMTD_CHART_FETCH_TIMEOUT = 12000;

function _lmtdFetchBalance(){
  fetch('/api/wallet/balance', {credentials:'include'}).then(function(r){return r.json();}).then(function(d){
    if(d.ok) _lmtdSolBalance = d.sol;
  }).catch(function(){});
}

/* Raw chart-data fetch only — no DOM/chart-instance interaction, so it's
   safe to kick off before the chart container even exists (i.e. in parallel
   with the DexScreener pair-search below). Independent try/catch from that
   search: a failure here never blocks or breaks the pair-search, and vice
   versa (see _lmtdRenderChartData). Races the fetch against a 12s timeout so
   a hung request can't leave the loading state stuck forever. */
async function _lmtdFetchChartData(addr, tf){
  var tfParam = _LMTD_TF_MAP[tf] || '5m';
  var fetchPromise = fetch('/api/chart/'+encodeURIComponent(addr)+'?tf='+tfParam)
    .then(function(x){return x.json();})
    .catch(function(){return null;});
  var timeoutPromise = new Promise(function(resolve){
    setTimeout(function(){ resolve(null); }, _LMTD_CHART_FETCH_TIMEOUT);
  });
  return await Promise.race([fetchPromise, timeoutPromise]);
}

async function showTokenCard(symbol, knownAddr){
  var modal = document.getElementById('lm-token-modal');
  var body  = document.getElementById('lm-modal-body');
  modal.style.display = 'flex';
  _lmtdLayout = 'focus';
  _lmtdTf     = '5m';
  _lmtdSide   = 'buy';
  _lmtdFetchBalance();
  // The mint address is already known from the table row at click time —
  // start the chart fetch right away, in parallel with the pair-search
  // below, instead of waiting for that search to resolve it first.
  _lmtdActiveMint = knownAddr || '';
  _lmtdChartPromise = knownAddr ? _lmtdFetchChartData(knownAddr, _lmtdTf) : null;
  body.innerHTML = '<div style="text-align:center;padding:60px 0">'
    +'<div style="width:30px;height:30px;border:3px solid #16191f;border-top-color:#f7b955;border-radius:50%;margin:0 auto 14px;animation:tcSpin .8s linear infinite"></div>'
    +'<div style="color:#565d68;font-size:13px;font-family:\'JetBrains Mono\',monospace">Loading…</div>'
    +'</div>';
  try{
    var r = await fetch('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(symbol));
    var d = await r.json();
    var p = (d.pairs||[]).find(function(x){ return x.chainId==='solana'; });
    if(!p){
      body.innerHTML='<div style="text-align:center;padding:48px 20px;color:#565d68;font-size:13px">No Solana pair found for $'+_esc(symbol)+'</div>';
      return;
    }
    _lmtdPair   = p;
    _lmtdSymbol = (p.baseToken&&p.baseToken.symbol)||symbol;
    // No pre-known address (e.g. opened via ?token= URL param, not a row
    // click) — fall back to starting the chart fetch only now.
    if(!_lmtdChartPromise){
      var addr = (p.baseToken&&p.baseToken.address)||'';
      _lmtdActiveMint = addr;
      _lmtdChartPromise = addr ? _lmtdFetchChartData(addr, _lmtdTf) : null;
    }
    _lmtdRenderModal();
  }catch(e){
    body.innerHTML='<div style="text-align:center;padding:48px 20px;color:#ff4d6a;font-size:13px;font-family:\'JetBrains Mono\',monospace">Failed to load token data</div>';
  }
}

function _lmtdCloseModal(){
  document.getElementById('lm-token-modal').style.display = 'none';
  if(_lmtdChart){ try{ _lmtdChart.remove(); }catch(e){} _lmtdChart=null; _lmtdSeries=null; _lmtdVolSeries=null; }
  _lmtdActiveMint = ''; // any fetch still in flight for the closed token now reads as stale
}

function _lmtdRenderModal(){

  var name = (p.baseToken&&p.baseToken.name)||sym;

    ? '<img class="lmtd-logo" src="'+_esc(imgUrl)+'">'

    return '<button class="lmtd-tf-btn'+(tf===_lmtdTf?' active':'')+'" onclick="_lmtdSetTf(\''+tf+'\')">'+tf+'</button>';
  }).join('');

  var headerHtml =
    '<div class="lmtd-header">'
      +logo
      +'<div class="lmtd-title-wrap">'
        +'<div class="lmtd-name">'+_esc(name||sym)
          +'<span class="lmtd-chain-badge">SOLANA</span>'
          +'<span class="lmtd-live-dot-wrap"><span class="lmtd-live-dot"></span>LIVE</span>'
        +'</div>'
        +'<div class="lmtd-sym">$'+_esc(sym)+'</div>'
      +'</div>'
      +'<div class="lmtd-layout-toggle">'
        +'<button class="lmtd-layout-btn'+(_lmtdLayout==='focus'?' active':'')+'" onclick="_lmtdSetLayout(\'focus\')">Focus</button>'
        +'<button class="lmtd-layout-btn'+(_lmtdLayout==='terminal'?' active':'')+'" onclick="_lmtdSetLayout(\'terminal\')">Terminal</button>'
      +'</div>'
    +'</div>'
    +'<div class="lmtd-hero">'
      +'<div class="lmtd-hero-price">'+price+'</div>'
      +'<div class="lmtd-hero-chg" style="color:'+chgColor+'">'+chgStr+' (24h)</div>'
    +'</div>'
    +'<div class="lmtd-tf-tabs">'+tfHtml+'</div>';

  var chartHtml = '<div class="lmtd-chart-container" id="lmtd-chart-container">'
    +'<div class="lmtd-chart-loading" id="lmtd-chart-loading">Loading chart…</div>'
    +'</div>';

  var bodyHtml;
  if(_lmtdLayout === 'focus'){
    bodyHtml = headerHtml
      +'<div class="lmtd-chart-wrap">'+chartHtml+'</div>'

  } else {
    bodyHtml = headerHtml
      +'<div class="lmtd-terminal">'
        +'<div class="lmtd-terminal-chart">'+chartHtml+'</div>'
        +'<div class="lmtd-terminal-side"><div id="lmtd-terminal-side-inner">'+_lmtdSidePanelHtml(p, sym, addr)+'</div></div>'
      +'</div>';
  }
  body.innerHTML = bodyHtml;
  _lmtdInitChart();
  if(_lmtdChartPromise){
    _lmtdRenderChartData(_lmtdChartPromise, _lmtdActiveMint);
    _lmtdChartPromise = null; // consumed — a later tf switch starts its own fresh fetch
  } else {
    _lmtdLoadChartData();
  }
  if(_lmtdLayout === 'terminal') _lmtdWireSidePanel(sym, addr);
}

/* 5-tile stat row (Focus layout): Volume 24h, Liquidity, Market Cap, Holders, Buys/Sells ratio.
   Holders has no data source anywhere in this codebase (checked dashboard.py + this file) —
   shown as "—" rather than fabricated. */
function _lmtdStatTilesHtml(p){
  var vol   = _fmtNum(p.volume&&p.volume.h24!=null?p.volume.h24:null);
  var liq   = _fmtNum(p.liquidity&&p.liquidity.usd!=null?p.liquidity.usd:null);
  var mcap  = _fmtNum(p.marketCap || p.fdv || null);
  var buys  = p.txns&&p.txns.h24 ? p.txns.h24.buys : 0;
  var sells = p.txns&&p.txns.h24 ? p.txns.h24.sells : 0;
  var total = buys+sells;
  var buyPct = total>0 ? Math.round(buys/total*100) : 50;
  var buysSellsVal = p.txns&&p.txns.h24
    ? buys+' / '+sells+'<div class="lmtd-ratio-bar"><div class="lmtd-ratio-buy" style="width:'+buyPct+'%"></div><div class="lmtd-ratio-sell" style="width:'+(100-buyPct)+'%"></div></div>'
    : '—';
  return [
    {l:'Volume 24h',  v:vol},
    {l:'Liquidity',   v:liq},
    {l:'Market Cap',  v:mcap},
    {l:'Holders',     v:'—'},
    {l:'Buys/Sells',  v:buysSellsVal}
  ].map(function(t){
    return '<div class="lmtd-stat-tile">'
      +'<div class="lmtd-stat-tile-label">'+t.l+'</div>'
      +'<div class="lmtd-stat-tile-value">'+t.v+'</div>'
      +'</div>';
  }).join('');
}

function _lmtdSetTf(tf){
  _lmtdTf = tf;

function _lmtdSetSide(side){
  var prevInput = document.getElementById('lmtd-sol-input');
  var prevVal   = prevInput ? prevInput.value : '0.1';
  _lmtdSide = side;
  var panel = document.getElementById('lmtd-terminal-side-inner');
  var p     = _lmtdPair;

function _lmtdSetPct(pct){
  var input = document.getElementById('lmtd-sol-input');
  if(!input) return;
  var bal = _lmtdSolBalance || 0;
  var amt = pct===100 ? Math.max(0, bal-0.01) : bal*pct/100;
  input.value = amt.toFixed(4);

/* candlestick + volume chart — same LightweightCharts pattern as
   dashboard.html's _posChart, fed by the existing /api/chart/<mint> endpoint */
function _lmtdInitChart(){
  var container = document.getElementById('lmtd-chart-container');
  if(!container) return;
  if(_lmtdChart){ try{ _lmtdChart.remove(); }catch(e){} _lmtdChart=null; _lmtdSeries=null; _lmtdVolSeries=null; }
  _lmtdChart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight || 340,
    layout:{background:{type:'solid',color:'#16191f'},textColor:'#c7ccd4'},
    grid:{vertLines:{color:'#21252c'},horzLines:{color:'#21252c'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:'#21252c'},
    timeScale:{borderColor:'#21252c',timeVisible:true,secondsVisible:false},
    handleScroll:true,handleScale:true
  });
  _lmtdSeries = _lmtdChart.addCandlestickSeries({
    upColor:'#3ad29b',downColor:'#ff4d6a',borderVisible:false,
    wickUpColor:'#3ad29b',wickDownColor:'#ff4d6a'
  });
  _lmtdVolSeries = _lmtdChart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'lmtd-vol'});
  _lmtdChart.priceScale('lmtd-vol').applyOptions({scaleMargins:{top:0.75,bottom:0}});
  new ResizeObserver(function(){
    if(container.clientWidth>0) _lmtdChart.applyOptions({width:container.clientWidth,height:container.clientHeight});
  }).observe(container);
}

/* Awaits a chart-data promise (already in flight — started in parallel with
   the pair-search — or freshly created) and renders it into the existing
   chart instance. Fully independent of the pair-search path: a failure here
   only ever affects the chart's own loading/unavailable state.
   forMint is the mint this fetch was started for — re-checked against
   _lmtdActiveMint once the data lands, so a slow/stale fetch from a token
   the user has since navigated away from (switched tokens, or closed the
   modal) is silently dropped instead of rendering into the wrong chart. */
async function _lmtdRenderChartData(dataPromise, forMint){
  var loadEl = document.getElementById('lmtd-chart-loading');
  if(loadEl){ loadEl.textContent='Loading chart…'; loadEl.style.display='flex'; }
  if(!_lmtdChart) return;
  var r = await dataPromise;
  if(forMint !== _lmtdActiveMint) return; // stale — modal has moved on since this fetch started
  if(r && r.candles && r.candles.length){
    try{
      _lmtdSeries.setData(r.candles.map(function(c){ return {time:c.t, open:c.o, high:c.h, low:c.l, close:c.c}; }));
      _lmtdVolSeries.setData(r.candles.map(function(c){ return {time:c.t, value:c.v, color: c.c>=c.o ? 'rgba(58,210,155,.45)' : 'rgba(255,77,106,.45)'}; }));
      _lmtdChart.timeScale().fitContent();
      if(loadEl) loadEl.style.display='none';
    }catch(e){
      console.error('[lmtd] chart.setData failed', e);
      if(loadEl){ loadEl.textContent='Chart unavailable for this token'; loadEl.style.display='flex'; }
    }
  } else if(loadEl){
    loadEl.textContent = 'Chart unavailable for this token';
    loadEl.style.display = 'flex';
  }
}

/* Timeframe switch (and any other reload with no pre-started promise to
   consume) — nothing to parallelize here, so it just fetches then renders. */
function _lmtdLoadChartData(){
  var addr = (_lmtdPair && _lmtdPair.baseToken && _lmtdPair.baseToken.address) || '';
  if(!addr || !_lmtdChart) return;
  _lmtdRenderChartData(_lmtdFetchChartData(addr, _lmtdTf), addr);
}

/* ── toast ── */
function _toast(msg, ok){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);'
    +'background:#101216;color:#eef1f5;border:1px solid #16191f;'
    +'border-radius:12px;padding:11px 20px;font-size:13px;font-weight:700;'
    +'font-family:\'JetBrains Mono\',monospace;z-index:9999;pointer-events:none;'
    +'opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.5)';
  document.body.appendChild(t);
  requestAnimationFrame(function(){
    t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
    setTimeout(function(){
      t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(12px)';
      setTimeout(function(){ t.remove(); }, 250);
    }, 3000);
  });
}

/* ── trade execution (modal) ── */
async function executeTrade(symbol, pairAddress, side, amountStr, tokenAddress, btn){
  var amount = parseFloat(amountStr);
  if(!amount||amount<=0){ _toast('Enter a valid SOL amount', false); return; }
  var origHtml = btn ? btn.innerHTML : '';
  var origBg   = btn ? btn.style.background : '';
  var spinner  = '<span style="display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.25);border-top-color:rgba(0,0,0,.6);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle"></span>';
  if(btn){ btn.innerHTML=spinner; btn.disabled=true; }
  var ok = await _doTrade(symbol, pairAddress, side, amount, tokenAddress);
  if(btn){ btn.innerHTML=origHtml; btn.disabled=false; btn.style.background=origBg; }
  if(ok) _toast(side==='buy' ? 'Buy order executed' : 'Sold', true);
}

/* ── helpers ── */
function _fmtPrice(p){
  if(!p) return '—';
  p = parseFloat(p);
  if(isNaN(p)||p<=0) return '—';
  if(p>=1) return '$'+p.toFixed(2);
  if(p>=0.0001) return '$'+p.toFixed(6);
  return '$'+p.toFixed(10).replace(/0+$/,'');
}
function _fmtNum(n){
  if(n==null||isNaN(n)) return '—';
  if(n>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toFixed(2);
}
function _fmtAge(ms){
  if(!ms) return '—';
  var diff = Date.now()-ms;
  var mins = Math.floor(diff/60000);
  if(mins<1)  return '<1m';
  if(mins<60) return mins+'m';
  var hrs = Math.floor(mins/60);
  if(hrs<24)  return hrs+'h';
  return Math.floor(hrs/24)+'d';
}
function _esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _setLoading(){
  document.getElementById('lm-table-wrap').innerHTML =
    _buildTable('<tr class="lm-status-row"><td colspan="8"><span class="lm-spinner-ring"></span>Loading…</td></tr>');
}
function _setError(msg){
  document.getElementById('lm-table-wrap').innerHTML =
    _buildTable('<tr class="lm-status-row"><td colspan="8" style="color:#ff4d6a">'+msg+'</td></tr>');
}

/* ── auth headers ── */
var _lmCsrf         = (document.querySelector('meta[name="csrf-token"]')||{}).content||'';
var _lmClientSecret = (document.querySelector('meta[name="client-secret"]')||{}).content||'';

/* ── init ── */
_loadTab('trending');
_lmInitFeatured();

(function(){
  var _urlToken = new URLSearchParams(location.search).get('token');
  if(_urlToken) showTokenCard(_urlToken);
})();

setInterval(function(){
  if(!document.getElementById('lm-chip-search').value && _openDropIdx < 0){
    _silentRefreshTab(_activeTab);
  }
}, 15000);
