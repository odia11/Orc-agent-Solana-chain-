<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="client-secret" content="{{ client_secret }}">
<title>Friends — OrcAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<link rel="stylesheet" href="/static/token-card.css?v={{ app_version }}">
<style>
:root{--bg:#0a0b0e;--bg2:#101216;--bg3:#16191f;--bg4:#21252c;--accent:#f7b955;--text:#eef1f5;--muted:#565d68;--green:#3ad29b;--red:#ff4d6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}

/* header */
.lm-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bg3)}
.lm-header-title-wrap{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.lm-header-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:6px}
.lm-back{text-decoration:none;color:var(--muted);font-size:11px;white-space:nowrap;transition:color .15s;flex-shrink:0}
.lm-back:hover{color:var(--text)}

/* portfolio header — wallet SOL + open-position value combined, above
   Weekly Top Trades; hidden entirely when /api/portfolio-summary 401s
   (no wallet connected) or errors */
.fr-portfolio-header{margin:16px 16px 0;background:var(--bg2);border:1px solid var(--bg3);border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fr-portfolio-left{min-width:0}
.fr-portfolio-total{font-size:24px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace}
.fr-portfolio-pnl{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:2px}
.fr-portfolio-deposit-btn{flex-shrink:0;background:var(--accent);color:#0a0b0e;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;text-decoration:none;transition:opacity .15s;white-space:nowrap}
.fr-portfolio-deposit-btn:hover{opacity:.85}

/* weekly top trades — horizontal-scroll cards, moved here from
   live_market.html (same card/scroll pattern), fed by /api/top-trades-week */
.fr-weekly-section{margin:16px 16px 0}
.fr-weekly-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fr-weekly-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.fr-weekly-card{flex:0 0 auto;width:168px;background:linear-gradient(to bottom, rgba(247,185,85,.08), rgba(247,185,85,.02));border:1px solid rgba(247,185,85,.25);border-radius:12px;padding:10px;cursor:pointer;transition:border-color .15s}
.fr-weekly-card:hover{border-color:rgba(247,185,85,.5)}
.fr-weekly-card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;min-width:0}
.fr-weekly-avatar{width:22px;height:22px;border-radius:6px;object-fit:cover;flex-shrink:0}
.fr-weekly-avatar-ph{width:22px;height:22px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--muted);flex-shrink:0}
.fr-weekly-username{font-size:11px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fr-weekly-verified{color:var(--green);font-size:10px;flex-shrink:0}
.fr-weekly-card-bottom{display:flex;align-items:center;gap:6px}
.fr-weekly-token-logo{width:20px;height:20px;border-radius:6px;object-fit:cover;flex-shrink:0}
.fr-weekly-token-logo-ph{width:20px;height:20px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--muted);flex-shrink:0}
.fr-weekly-pnl{font-size:13px;font-weight:700;color:var(--green);font-family:'JetBrains Mono',monospace}

/* following list — the social equivalent of the token-holders tab, but one
   row per followed friend instead of one row per token holder */
.fr-section{margin:20px 16px 0}
.fr-section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fr-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12px;background:var(--bg2);border:1px solid var(--bg3);border-radius:16px}

.fr-friend-row{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;margin-bottom:10px}
.fr-friend-avatar{width:38px;height:38px;border-radius:11px;object-fit:cover;flex-shrink:0}
.fr-friend-avatar-ph{width:38px;height:38px;border-radius:11px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.fr-friend-main{flex:1;min-width:0}
.fr-friend-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px;min-width:0}
.fr-friend-name{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;min-width:0}
.fr-friend-verified{color:var(--green);font-size:11px;flex-shrink:0}
.fr-friend-totals{text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.fr-friend-total-value{font-size:13px;font-weight:700;color:var(--text)}
.fr-friend-total-pnl{font-size:11px;font-weight:700;margin-top:2px}
.fr-friend-tokens{display:flex;flex-wrap:wrap;gap:6px}
.fr-friend-token-chip{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;transition:border-color .15s}
.fr-friend-token-chip:hover{border-color:rgba(247,185,85,.4)}
.fr-friend-token-sym{font-weight:700;color:var(--text)}
.fr-friend-token-pnl{font-family:'JetBrains Mono',monospace;font-weight:700}

/* popular-among-friends — tokens held by 2+ followed friends */
.fr-shared-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.fr-shared-row:hover{border-color:rgba(247,185,85,.4)}
.fr-shared-sym{font-size:13px;font-weight:700;color:var(--text)}
.fr-shared-count{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* suggested traders — shown in place of the Following list when the user
   follows nobody yet, sourced from /api/leaderboard (today's top traders) */
.fr-empty-heading{padding:0 0 10px;text-align:center;color:var(--muted);font-size:12px}
.fr-suggest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fr-suggest-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px;background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;min-width:0}
.fr-suggest-avatar{width:40px;height:40px;border-radius:11px;object-fit:cover}
.fr-suggest-avatar-ph{width:40px;height:40px;border-radius:11px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.fr-suggest-name{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-suggest-verified{color:var(--green);font-size:10px;flex-shrink:0}
.fr-suggest-pnl{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.fr-suggest-follow-btn{width:100%;background:var(--accent);color:#0a0b0e;border:none;border-radius:8px;padding:7px 0;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:opacity .15s}
.fr-suggest-follow-btn:hover{opacity:.85}
.fr-suggest-follow-btn:disabled{opacity:.5;cursor:default}

/* tokens list — Trending / Most held by friends / New, mobile card style
   (no table), below Popular Among Friends */
.fr-tok-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fr-tok-chip{padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);background:var(--bg2);border:1px solid var(--bg4);border-radius:20px;transition:all .15s;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.fr-tok-chip:hover{color:var(--text);border-color:var(--bg3)}
.fr-tok-chip.active{background:rgba(247,185,85,.12);color:var(--accent);border-color:rgba(247,185,85,.25)}

.fr-tok-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;min-width:0}
.fr-tok-card:hover{border-color:rgba(247,185,85,.4)}
.fr-tok-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0}
.fr-tok-logo-ph{width:40px;height:40px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.fr-tok-main{flex:1;min-width:0}
.fr-tok-name-row{display:flex;align-items:center;gap:6px;min-width:0}
.fr-tok-name{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fr-tok-age{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.fr-tok-sub-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.fr-tok-mcap{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.fr-tok-holders{display:flex;align-items:center}
.fr-tok-holder-avatar{width:16px;height:16px;border-radius:50%;object-fit:cover;border:1.5px solid var(--bg2);margin-left:-6px;flex-shrink:0}
.fr-tok-holder-avatar-ph{width:16px;height:16px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--bg2);margin-left:-6px;flex-shrink:0;font-size:7px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.fr-tok-holder-avatar:first-child,.fr-tok-holder-avatar-ph:first-child{margin-left:0}
.fr-tok-holder-count{font-size:10px;color:var(--muted);margin-left:6px;font-family:'JetBrains Mono',monospace}
.fr-tok-right{text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.fr-tok-price{font-size:14px;font-weight:700;color:var(--text)}
.fr-tok-chg{font-size:12px;font-weight:700;margin-top:2px}

/* token detail modal — card itself (.lm-modal-card, .lmtd-*) lives in
   static/token-card.css, shared with /live-market and the standalone
   /token/<mint> page; this is just the fixed-overlay backdrop + close
   button, kept under the lm- prefix since static/token-card.js looks up
   #lm-token-modal / #lm-modal-body by those exact ids. */
#lm-token-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.lm-modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:color .15s;font-family:system-ui,sans-serif;z-index:2}
.lm-modal-close:hover{color:var(--text)}

/* ── MOBILE BACK BAR ── */
.mobile-back-bar{display:none}
@media(max-width:767px){
  .mobile-back-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;z-index:30;background:#101216;border-bottom:1px solid #16191f}
  .mobile-back-btn{color:#f7b955;font-size:15px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .mobile-page-title{font-size:16px;font-weight:600;color:#eef1f5;font-family:inherit}
  .lm-header{display:none!important}
  .lm-modal-close{min-width:44px;min-height:44px}
  #lm-token-modal{padding:0;align-items:stretch}
  .lm-modal-card{min-height:100vh}
}

@media(max-width:428px){
  .lm-modal-close{top:10px;right:4px}
}

::-webkit-scrollbar{height:4px;width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
</style>
</head>
<body>

<div class="mobile-back-bar">
  <button onclick="location.href='/'" class="mobile-back-btn">← Back</button>
  <span class="mobile-page-title">Friends</span>
</div>

<header class="lm-header">
  <a class="lm-back" href="/">← Back</a>
  <div class="lm-header-title-wrap">
    <div class="lm-header-title">Friends</div>
  </div>
</header>

<div class="fr-portfolio-header" id="fr-portfolio-header" style="display:none;">
  <div class="fr-portfolio-left">
    <div class="fr-portfolio-total" id="fr-portfolio-total">—</div>
    <div class="fr-portfolio-pnl" id="fr-portfolio-pnl">—</div>
  </div>
  <a class="fr-portfolio-deposit-btn" href="/wallet">Deposit</a>
</div>

<div class="fr-weekly-section" id="fr-weekly-section" style="display:none;">
  <div class="fr-weekly-title">Weekly Top Trades</div>
  <div class="fr-weekly-scroll" id="fr-weekly-scroll"></div>
</div>

<div class="fr-section" id="fr-following-section">
  <div class="fr-section-title">Following</div>
  <div id="fr-following-list"></div>
</div>

<div class="fr-section" id="fr-shared-section" style="display:none;">
  <div class="fr-section-title">Popular Among Friends</div>
  <div id="fr-shared-list"></div>
</div>

<div class="fr-section" id="fr-tokens-section">
  <div class="fr-section-title">Tokens</div>
  <div class="fr-tok-chips" id="fr-tok-chips">
    <button class="fr-tok-chip active" id="fr-tok-chip-trending" onclick="_frTokSetChip('trending')">Trending</button>
    <button class="fr-tok-chip"        id="fr-tok-chip-held"     onclick="_frTokSetChip('held')">Most held by friends</button>
    <button class="fr-tok-chip"        id="fr-tok-chip-new"      onclick="_frTokSetChip('new')">New</button>
  </div>
  <div id="fr-tok-list"></div>
</div>

<!-- token detail modal (Focus / Terminal / Holders — see static/token-card.js) -->
<div id="lm-token-modal" onclick="if(event.target===this)_lmtdCloseModal()">
  <div class="lm-modal-card" onclick="event.stopPropagation()">
    <button class="lm-modal-close" onclick="_lmtdCloseModal()">✕</button>
    <div id="lm-modal-body"></div>
  </div>
</div>

<script src="/static/token-card.js?v={{ app_version }}"></script>
<script>
'use strict';

/* weekly top trades — horizontal-scroll cards fed by /api/top-trades-week
   (individual winning trades, not aggregated per user like /leaderboard).
   pnl is stored in SOL server-side; converted to USD here using the same
   sol_price_usd already exposed by /api/wallet/balance (the endpoint
   static/token-card.js's own balance fetch already calls) instead of
   introducing a second source for the rate. */
function _frWeeklyCardHtml(t, solPriceUsd){
  var avatar = t.avatar_url
    ? '<img class="fr-weekly-avatar" src="'+_esc(t.avatar_url)+'">'
    : '<div class="fr-weekly-avatar-ph">'+_esc((t.username||'?').slice(0,2))+'</div>';
  var verified = t.is_verified ? '<span class="fr-weekly-verified">✓</span>' : '';
  var sym      = t.token || '?';
  var pnlUsd   = solPriceUsd>0 ? '+'+_fmtNum(t.pnl*solPriceUsd) : '—';
  return '<div class="fr-weekly-card" data-sym="'+_esc(sym)+'" data-addr="'+_esc(t.mint_address||'')+'">'
    +'<div class="fr-weekly-card-top">'
      +avatar
      +'<span class="fr-weekly-username">'+_esc(t.username||'—')+'</span>'
      +verified
    +'</div>'
    +'<div class="fr-weekly-card-bottom">'
      +'<div class="fr-weekly-token-logo-ph">'+_esc(sym.slice(0,2))+'</div>'
      +'<span class="fr-weekly-pnl">'+pnlUsd+'</span>'
    +'</div>'
  +'</div>';
}

/* portfolio header — combines wallet SOL balance + open-position value from
   /api/portfolio-summary into one USD total, with unrealized PnL below it.
   A 401 (no wallet) or any fetch error just hides the whole header instead
   of showing a broken/zeroed-out card. */
async function _frInitPortfolioHeader(){
  var header  = document.getElementById('fr-portfolio-header');
  var totalEl = document.getElementById('fr-portfolio-total');
  var pnlEl   = document.getElementById('fr-portfolio-pnl');
  if(!header || !totalEl || !pnlEl) return;
  try{
    var r = await fetch('/api/portfolio-summary', {credentials:'include'});
    var d = await r.json();
    if(!d.ok){ header.style.display = 'none'; return; }

    var walletUsd = (d.sol_price_usd>0) ? d.sol_balance*d.sol_price_usd : 0;
    var totalUsd  = walletUsd + (d.positions_value_usd || 0);
    totalEl.textContent = _fmtNum(totalUsd);

    var pnlUsd = d.total_pnl_usd;
    if(pnlUsd == null){
      pnlEl.textContent = '—';
      pnlEl.style.color = 'var(--muted)';
    } else {
      pnlEl.textContent = (pnlUsd>=0?'+':'-') + _fmtNum(Math.abs(pnlUsd));
      pnlEl.style.color = pnlUsd>=0 ? 'var(--green)' : 'var(--red)';
    }
    header.style.display = '';
  }catch(e){
    header.style.display = 'none';
  }
}

async function _frInitWeeklyTopTrades(){
  var section = document.getElementById('fr-weekly-section');
  var scroll  = document.getElementById('fr-weekly-scroll');
  if(!section || !scroll) return;
  try{
    var solPriceUsd = 0;
    try{
      var br = await fetch('/api/wallet/balance', {credentials:'include'});
      var bd = await br.json();
      if(bd.ok) solPriceUsd = bd.sol_price_usd || 0;
    }catch(e){}

    var r = await fetch('/api/top-trades-week', {credentials:'include'});
    var d = await r.json();
    var trades = (d.ok && d.trades) || [];
    if(!trades.length){ section.style.display = 'none'; return; }

    scroll.innerHTML = trades.map(function(t){ return _frWeeklyCardHtml(t, solPriceUsd); }).join('');
    section.style.display = '';
  }catch(e){
    section.style.display = 'none';
  }
}

/* following list — social equivalent of the token holders-tab: one row per
   followed friend, each with their held tokens as chips (symbol + PnL),
   fed by /api/friends/positions. */
function _frFriendTokenChipHtml(p){
  var pnlColor = (p.pnl_usd==null) ? 'var(--muted)' : (p.pnl_usd>=0 ? 'var(--green)' : 'var(--red)');
  var pnlStr   = p.pnl_usd==null ? '—' : (p.pnl_usd>=0?'+':'-')+_fmtNum(Math.abs(p.pnl_usd));
  return '<div class="fr-friend-token-chip" data-sym="'+_esc(p.symbol)+'" data-addr="'+_esc(p.mint_address)+'">'
    +'<span class="fr-friend-token-sym">$'+_esc(p.symbol)+'</span>'
    +'<span class="fr-friend-token-pnl" style="color:'+pnlColor+'">'+pnlStr+'</span>'
  +'</div>';
}

function _frFriendRowHtml(f){
  var avatar = f.avatar_url
    ? '<img class="fr-friend-avatar" src="'+_esc(f.avatar_url)+'">'
    : '<div class="fr-friend-avatar-ph">'+_esc((f.username||'?').slice(0,2))+'</div>';
  var verified = f.is_verified ? '<span class="fr-friend-verified">✓</span>' : '';
  var pnlColor = f.total_pnl_usd>=0 ? 'var(--green)' : 'var(--red)';
  var pnlStr   = (f.total_pnl_usd>=0?'+':'-')+_fmtNum(Math.abs(f.total_pnl_usd));
  return '<div class="fr-friend-row">'
    +avatar
    +'<div class="fr-friend-main">'
      +'<div class="fr-friend-head">'
        +'<div class="fr-friend-name">'+_esc(f.username||'—')+verified+'</div>'
        +'<div class="fr-friend-totals">'
          +'<div class="fr-friend-total-value">'+_fmtNum(f.total_value_usd)+'</div>'
          +'<div class="fr-friend-total-pnl" style="color:'+pnlColor+'">'+pnlStr+'</div>'
        +'</div>'
      +'</div>'
      +'<div class="fr-friend-tokens">'+f.positions.map(_frFriendTokenChipHtml).join('')+'</div>'
    +'</div>'
  +'</div>';
}

function _frSharedRowHtml(s){
  return '<div class="fr-shared-row" data-sym="'+_esc(s.symbol)+'" data-addr="'+_esc(s.mint_address)+'">'
    +'<span class="fr-shared-sym">$'+_esc(s.symbol)+'</span>'
    +'<span class="fr-shared-count">'+s.count+' friends hold this</span>'
  +'</div>';
}

/* Suggested traders -- replaces the plain "Follow some traders..." empty
   state with the top 4 from /api/leaderboard (today's pnl leaderboard,
   same endpoint/pattern traders.html and profile.html already use for
   follow buttons: POST /api/follow/toggle, {wallet}). total_pnl there is
   USD despite nowhere labeling it so (see _record_user_trade()'s pnl
   calc, which is USD like everywhere else in this app) -- formatted
   with _fmtNum, not a SOL suffix. */
function _frSuggestedCardHtml(t){
  var avatar = t.avatar_url
    ? '<img class="fr-suggest-avatar" src="'+_esc(t.avatar_url)+'">'
    : '<div class="fr-suggest-avatar-ph">'+_esc((t.username||'?').slice(0,2))+'</div>';
  var verified = (t.badges||[]).indexOf('verified')>=0 ? '<span class="fr-suggest-verified">✓</span>' : '';
  var pnlColor = t.total_pnl>=0 ? 'var(--green)' : 'var(--red)';
  var pnlStr   = (t.total_pnl>=0?'+':'-')+_fmtNum(Math.abs(t.total_pnl));
  return '<div class="fr-suggest-card">'
    +avatar
    +'<div class="fr-suggest-name">'+_esc(t.username||'—')+verified+'</div>'
    +'<div class="fr-suggest-pnl" style="color:'+pnlColor+'">'+pnlStr+'</div>'
    +'<button class="fr-suggest-follow-btn" data-wallet="'+_esc(t.wallet_address)+'">Volgen</button>'
  +'</div>';
}

async function _frRenderSuggestedTraders(container){
  try{
    var r   = await fetch('/api/leaderboard', {credentials:'include'});
    var top = await r.json();
    top = (Array.isArray(top) ? top : []).slice(0,4);
    if(!top.length){
      container.innerHTML = '<div class="fr-empty">Follow some traders to see what they\'re holding here.</div>';
      return;
    }
    container.innerHTML = '<div class="fr-empty-heading">Nog niemand gevolgd — probeer deze top traders:</div>'
      +'<div class="fr-suggest-grid">'+top.map(_frSuggestedCardHtml).join('')+'</div>';
  }catch(e){
    container.innerHTML = '<div class="fr-empty">Follow some traders to see what they\'re holding here.</div>';
  }
}

/* Shared data source for Following / Popular Among Friends / the Tokens
   list's "Most held by friends" chip and per-row friend-avatar stacks --
   fetched once (cached in _frFriendsDataPromise) since all consumers need
   the same /api/friends/positions payload. Populates _frFriendsByMint as
   a side effect so the Tokens list doesn't need its own fetch to know
   which friends hold which mint. */
var _frFriendsByMint = {}; // mint_address -> {symbol, holders: [{avatar_url, username}]}
var _frFriendsDataPromise = null;

function _frGetFriendsData(){
  if(!_frFriendsDataPromise){
    _frFriendsDataPromise = fetch('/api/friends/positions', {credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var friends = (d.ok && d.friends) || [];
        friends.forEach(function(f){
          f.positions.forEach(function(p){
            if(!p.mint_address) return;
            var e = _frFriendsByMint[p.mint_address] || (_frFriendsByMint[p.mint_address] = {symbol: p.symbol, holders: []});
            e.holders.push({avatar_url: f.avatar_url, username: f.username});
          });
        });
        return friends;
      })
      .catch(function(){ return []; });
  }
  return _frFriendsDataPromise;
}

/* Popular Among Friends is derived from _frFriendsByMint (grouping by mint
   across every friend's positions, keeping mints held by 2+ of them)
   rather than a second endpoint, since the data's already fetched. */
async function _frInitFriendsPositions(){
  var followingList = document.getElementById('fr-following-list');
  var sharedSection  = document.getElementById('fr-shared-section');
  var sharedList     = document.getElementById('fr-shared-list');
  if(!followingList) return;
  var friends = await _frGetFriendsData();
  if(!friends.length){
    await _frRenderSuggestedTraders(followingList);
    return;
  }
  followingList.innerHTML = friends.map(_frFriendRowHtml).join('');

  var shared = Object.keys(_frFriendsByMint).map(function(mint){
    var e = _frFriendsByMint[mint];
    return {symbol: e.symbol, mint_address: mint, count: e.holders.length};
  }).filter(function(s){ return s.count >= 2; })
    .sort(function(a,b){ return b.count - a.count; });
  if(shared.length){
    sharedList.innerHTML = shared.map(_frSharedRowHtml).join('');
    sharedSection.style.display = '';
  }
}

/* ── age formatting — copied from live_market.html's _fmtAge() (not in the
   shared token-card.js), since friends.html has its own separate inline
   script and needs the same "2h"/"3d" style age label for token cards. ── */
function _fmtAge(ms){
  if(!ms) return '—';
  var diff = Date.now()-ms;
  var mins = Math.floor(diff/60000);
  if(mins<1)  return '<1m';
  if(mins<60) return mins+'m';
  var hrs = Math.floor(mins/60);
  if(hrs<24)  return hrs+'h';
  return Math.floor(hrs/24)+'d';
}

/* ── tokens list: Trending / Most held by friends / New ──
   Trending & New duplicate live_market.html's _fetchTrending/_fetchNew +
   _dedupeByAddress pattern (own inline script here, no shared module for
   this logic) -- same DexScreener-boosts/-profiles + batch-lookup calls.
   Most-held reuses _frGetFriendsData()/_frFriendsByMint instead of a
   separate fetch. */
var _frTokChipFilter = 'trending';
var _frTokPairsCache = {};

function _frDedupeByAddress(pairs, iconMap){
  var trustedQuotes = ['SOL','USDC','USDT'];
  var byAddr = {};
  pairs.forEach(function(p){
    var addr = p.baseToken&&p.baseToken.address;
    if(!addr) return;
    (byAddr[addr] = byAddr[addr] || []).push(p);
  });
  var best = {};
  Object.keys(byAddr).forEach(function(addr){
    var group = byAddr[addr];
    var trusted = group.filter(function(p){
      return trustedQuotes.indexOf(p.quoteToken&&p.quoteToken.symbol) !== -1;
    });
    var pool = trusted.length ? trusted : group;
    var bestP = null, bestLiq = -1;
    pool.forEach(function(p){
      var liq = (p.liquidity&&p.liquidity.usd)||0;
      if(!bestP || liq > bestLiq){ bestP = p; bestLiq = liq; }
    });
    best[addr] = bestP;
  });
  return Object.keys(best).map(function(addr){
    var p = best[addr];
    if(iconMap[addr]&&!(p.info&&p.info.imageUrl))
      p = Object.assign({},p,{_icon:iconMap[addr]});
    return p;
  }).slice(0,50);
}

async function _frFetchTrendingPairs(){
  var r     = await fetch('/api/dexscreener/token-boosts');
  var items = await r.json();
  var solana = (Array.isArray(items)?items:[]).filter(function(i){ return i.chainId==='solana'; }).slice(0,50);
  if(!solana.length) return [];
  var iconMap = {};
  solana.forEach(function(i){ iconMap[i.tokenAddress]=i.icon; });
  var addresses = solana.map(function(i){ return i.tokenAddress; }).join(',');
  var pr = await fetch('/api/dexscreener/tokens/'+addresses);
  var pd = await pr.json();
  return _frDedupeByAddress(pd.pairs||[], iconMap);
}

async function _frFetchNewPairs(){
  var r     = await fetch('/api/dexscreener/token-profiles');
  var items = await r.json();
  var solana = (Array.isArray(items)?items:[]).filter(function(i){ return i.chainId==='solana'; }).slice(0,50);
  if(!solana.length) return [];
  var iconMap = {};
  solana.forEach(function(i){ iconMap[i.tokenAddress]=i.icon; });
  var addresses = solana.map(function(i){ return i.tokenAddress; }).join(',');
  var pr = await fetch('/api/dexscreener/tokens/'+addresses);
  var pd = await pr.json();
  return _frDedupeByAddress(pd.pairs||[], iconMap);
}

async function _frFetchMostHeldPairs(){
  await _frGetFriendsData(); // ensures _frFriendsByMint is populated
  var mints = Object.keys(_frFriendsByMint);
  if(!mints.length) return [];
  var pr = await fetch('/api/dexscreener/tokens/'+mints.join(','));
  var pd = await pr.json();
  var pairs = _frDedupeByAddress(pd.pairs||[], {});
  pairs.sort(function(a,b){
    var ac = (_frFriendsByMint[a.baseToken&&a.baseToken.address]||{holders:[]}).holders.length;
    var bc = (_frFriendsByMint[b.baseToken&&b.baseToken.address]||{holders:[]}).holders.length;
    return bc-ac;
  });
  return pairs;
}

/* Up to 3 stacked friend avatars + "+N" overflow counter under the mcap,
   shown on every chip (not just "Most held by friends") whenever a friend
   holds that mint. */
function _frTokHoldersHtml(addr){
  var entry = _frFriendsByMint[addr];
  if(!entry || !entry.holders.length) return '';
  var shown = entry.holders.slice(0,3);
  var avatars = shown.map(function(h){
    return h.avatar_url
      ? '<img class="fr-tok-holder-avatar" src="'+_esc(h.avatar_url)+'" title="'+_esc(h.username||'')+'">'
      : '<div class="fr-tok-holder-avatar-ph" title="'+_esc(h.username||'')+'">'+_esc((h.username||'?').slice(0,1))+'</div>';
  }).join('');
  var extra = entry.holders.length > 3 ? '<span class="fr-tok-holder-count">+'+(entry.holders.length-3)+'</span>' : '';
  return '<div class="fr-tok-holders">'+avatars+extra+'</div>';
}

function _frTokCardHtml(p){
  var sym  = (p.baseToken&&p.baseToken.symbol)||'?';
  var name = (p.baseToken&&p.baseToken.name)||sym;
  var addr = (p.baseToken&&p.baseToken.address)||'';
  var imgUrl = (p.info&&p.info.imageUrl)||p._icon||'';
  var logo = imgUrl
    ? '<img class="fr-tok-logo" src="'+_esc(imgUrl)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
      +'<div class="fr-tok-logo-ph" style="display:none">'+_esc(sym.slice(0,2))+'</div>'
    : '<div class="fr-tok-logo-ph">'+_esc(sym.slice(0,2))+'</div>';
  var age   = _fmtAge(p.pairCreatedAt);
  var mcap  = _fmtNum(p.marketCap || p.fdv || null);
  var price = _fmtPrice(p.priceUsd);
  var chg24 = p.priceChange&&p.priceChange.h24!=null ? p.priceChange.h24 : null;
  var chgColor = chg24==null ? 'var(--muted)' : (chg24>=0?'var(--green)':'var(--red)');
  var chgStr   = chg24==null ? '—' : (chg24>=0?'+':'')+chg24.toFixed(2)+'%';
  return '<div class="fr-tok-card" data-sym="'+_esc(sym)+'" data-addr="'+_esc(addr)+'">'
    +logo
    +'<div class="fr-tok-main">'
      +'<div class="fr-tok-name-row">'
        +'<span class="fr-tok-name">'+_esc(name)+'</span>'
        +'<span class="fr-tok-age">'+age+'</span>'
      +'</div>'
      +'<div class="fr-tok-sub-row">'
        +'<span class="fr-tok-mcap">'+mcap+'</span>'
        +_frTokHoldersHtml(addr)
      +'</div>'
    +'</div>'
    +'<div class="fr-tok-right">'
      +'<div class="fr-tok-price">'+price+'</div>'
      +'<div class="fr-tok-chg" style="color:'+chgColor+'">'+chgStr+'</div>'
    +'</div>'
  +'</div>';
}

async function _frTokRenderChip(chip){
  var list = document.getElementById('fr-tok-list');
  if(!list) return;
  list.innerHTML = '<div class="fr-empty">Loading…</div>';
  var pairs = _frTokPairsCache[chip];
  if(!pairs){
    try{
      if(chip==='trending')     pairs = await _frFetchTrendingPairs();
      else if(chip==='new')     pairs = await _frFetchNewPairs();
      else                      pairs = await _frFetchMostHeldPairs();
      _frTokPairsCache[chip] = pairs;
    }catch(e){
      if(_frTokChipFilter === chip) list.innerHTML = '<div class="fr-empty">Could not load tokens.</div>';
      return;
    }
  }
  if(_frTokChipFilter !== chip) return; // stale -- user switched chips again mid-fetch
  if(!pairs.length){
    list.innerHTML = '<div class="fr-empty">No tokens found</div>';
    return;
  }
  list.innerHTML = pairs.map(_frTokCardHtml).join('');
}

function _frTokSetChip(chip){
  _frTokChipFilter = chip;
  ['trending','held','new'].forEach(function(c){
    document.getElementById('fr-tok-chip-'+c).classList.toggle('active', c===chip);
  });
  _frTokRenderChip(chip);
}

/* Waits for friend data before the first render so the avatar stacks
   (and the "held" chip, if clicked immediately) are correct from the
   start instead of only after a chip switch. */
async function _frInitTokensList(){
  await _frGetFriendsData();
  _frTokRenderChip('trending');
}

_frInitPortfolioHeader();
_frInitWeeklyTopTrades();
_frInitFriendsPositions();
_frInitTokensList();

(function(){
  var weeklyScroll = document.getElementById('fr-weekly-scroll');
  if(weeklyScroll){
    weeklyScroll.addEventListener('click', function(e){
      var card = e.target.closest('.fr-weekly-card');
      if(!card) return;
      showTokenCard(card.dataset.sym, card.dataset.addr);
    });
  }
})();

(function(){
  var followingList = document.getElementById('fr-following-list');
  var sharedList     = document.getElementById('fr-shared-list');
  function _frOpenFromClick(e){
    var el = e.target.closest('.fr-friend-token-chip, .fr-shared-row');
    if(!el) return;
    showTokenCard(el.dataset.sym, el.dataset.addr);
  }
  async function _frOnFollowClick(e){
    var btn = e.target.closest('.fr-suggest-follow-btn');
    if(!btn) return;
    btn.disabled = true;
    btn.textContent = '…';
    try{
      var r = await fetch('/api/follow/toggle', {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({wallet: btn.dataset.wallet})
      });
      var d = await r.json();
      if(d.ok && d.following){
        _frFriendsByMint = {};        // force a clean re-populate, not an append
        _frFriendsDataPromise = null; // force a fresh /api/friends/positions fetch
        _frInitFriendsPositions();
      } else {
        btn.disabled = false;
        btn.textContent = 'Volgen';
      }
    }catch(err){
      btn.disabled = false;
      btn.textContent = 'Volgen';
    }
  }
  if(followingList) followingList.addEventListener('click', _frOpenFromClick);
  if(followingList) followingList.addEventListener('click', _frOnFollowClick);
  if(sharedList)     sharedList.addEventListener('click', _frOpenFromClick);
})();

(function(){
  var tokList = document.getElementById('fr-tok-list');
  if(tokList){
    tokList.addEventListener('click', function(e){
      var card = e.target.closest('.fr-tok-card');
      if(!card) return;
      showTokenCard(card.dataset.sym, card.dataset.addr);
    });
  }
})();
</script>
