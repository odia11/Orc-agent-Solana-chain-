<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="client-secret" content="{{ client_secret }}">
<title>Friends — OrcAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
<link rel="stylesheet" href="/static/token-card.css?v={{ app_version }}">
<style>
:root{--bg:#0a0b0e;--bg2:#101216;--bg3:#16191f;--bg4:#21252c;--accent:#f7b955;--text:#eef1f5;--muted:#565d68;--green:#3ad29b;--red:#ff4d6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}

/* header */
.lm-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bg3)}
.lm-header-title-wrap{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.lm-header-title{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:6px}
.lm-back{text-decoration:none;color:var(--muted);font-size:11px;white-space:nowrap;transition:color .15s;flex-shrink:0}
.lm-back:hover{color:var(--text)}

/* weekly top trades — horizontal-scroll cards, moved here from
   live_market.html (same card/scroll pattern), fed by /api/top-trades-week */
.fr-weekly-section{margin:16px 16px 0}
.fr-weekly-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fr-weekly-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.fr-weekly-card{flex:0 0 auto;width:168px;background:linear-gradient(to bottom, rgba(247,185,85,.08), rgba(247,185,85,.02));border:1px solid rgba(247,185,85,.25);border-radius:12px;padding:10px;cursor:pointer;transition:border-color .15s}
.fr-weekly-card:hover{border-color:rgba(247,185,85,.5)}
.fr-weekly-card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;min-width:0}
.fr-weekly-avatar{width:22px;height:22px;border-radius:6px;object-fit:cover;flex-shrink:0}
.fr-weekly-avatar-ph{width:22px;height:22px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--muted);flex-shrink:0}
.fr-weekly-username{font-size:11px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fr-weekly-verified{color:var(--green);font-size:10px;flex-shrink:0}
.fr-weekly-card-bottom{display:flex;align-items:center;gap:6px}
.fr-weekly-token-logo{width:20px;height:20px;border-radius:6px;object-fit:cover;flex-shrink:0}
.fr-weekly-token-logo-ph{width:20px;height:20px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--muted);flex-shrink:0}
.fr-weekly-pnl{font-size:13px;font-weight:700;color:var(--green);font-family:'JetBrains Mono',monospace}

/* token detail modal — card itself (.lm-modal-card, .lmtd-*) lives in
   static/token-card.css, shared with /live-market and the standalone
   /token/<mint> page; this is just the fixed-overlay backdrop + close
   button, kept under the lm- prefix since static/token-card.js looks up
   #lm-token-modal / #lm-modal-body by those exact ids. */
#lm-token-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.lm-modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:color .15s;font-family:system-ui,sans-serif;z-index:2}
.lm-modal-close:hover{color:var(--text)}

/* ── MOBILE BACK BAR ── */
.mobile-back-bar{display:none}
@media(max-width:767px){
  .mobile-back-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;z-index:30;background:#101216;border-bottom:1px solid #16191f}
  .mobile-back-btn{color:#f7b955;font-size:15px;font-weight:600;background:none;border:none;cursor:pointer;padding:0;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .mobile-page-title{font-size:16px;font-weight:600;color:#eef1f5;font-family:inherit}
  .lm-header{display:none!important}
  .lm-modal-close{min-width:44px;min-height:44px}
  #lm-token-modal{padding:0;align-items:stretch}
  .lm-modal-card{min-height:100vh}
}

@media(max-width:428px){
  .lm-modal-close{top:10px;right:4px}
}

::-webkit-scrollbar{height:4px;width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
</style>
</head>
<body>

<div class="mobile-back-bar">
  <button onclick="location.href='/'" class="mobile-back-btn">← Back</button>
  <span class="mobile-page-title">Friends</span>
</div>

<header class="lm-header">
  <a class="lm-back" href="/">← Back</a>
  <div class="lm-header-title-wrap">
    <div class="lm-header-title">Friends</div>
  </div>
</header>

<div class="fr-weekly-section" id="fr-weekly-section" style="display:none;">
  <div class="fr-weekly-title">Weekly Top Trades</div>
  <div class="fr-weekly-scroll" id="fr-weekly-scroll"></div>
</div>

<div id="friends-content"></div>

<!-- token detail modal (Focus / Terminal / Holders — see static/token-card.js) -->
<div id="lm-token-modal" onclick="if(event.target===this)_lmtdCloseModal()">
  <div class="lm-modal-card" onclick="event.stopPropagation()">
    <button class="lm-modal-close" onclick="_lmtdCloseModal()">✕</button>
    <div id="lm-modal-body"></div>
  </div>
</div>

<script src="/static/token-card.js?v={{ app_version }}"></script>
<script>
'use strict';

/* weekly top trades — horizontal-scroll cards fed by /api/top-trades-week
   (individual winning trades, not aggregated per user like /leaderboard).
   pnl is stored in SOL server-side; converted to USD here using the same
   sol_price_usd already exposed by /api/wallet/balance (the endpoint
   static/token-card.js's own balance fetch already calls) instead of
   introducing a second source for the rate. */
function _frWeeklyCardHtml(t, solPriceUsd){
  var avatar = t.avatar_url
    ? '<img class="fr-weekly-avatar" src="'+_esc(t.avatar_url)+'">'
    : '<div class="fr-weekly-avatar-ph">'+_esc((t.username||'?').slice(0,2))+'</div>';
  var verified = t.is_verified ? '<span class="fr-weekly-verified">✓</span>' : '';
  var sym      = t.token || '?';
  var pnlUsd   = solPriceUsd>0 ? '+'+_fmtNum(t.pnl*solPriceUsd) : '—';
  return '<div class="fr-weekly-card" data-sym="'+_esc(sym)+'" data-addr="'+_esc(t.mint_address||'')+'">'
    +'<div class="fr-weekly-card-top">'
      +avatar
      +'<span class="fr-weekly-username">'+_esc(t.username||'—')+'</span>'
      +verified
    +'</div>'
    +'<div class="fr-weekly-card-bottom">'
      +'<div class="fr-weekly-token-logo-ph">'+_esc(sym.slice(0,2))+'</div>'
      +'<span class="fr-weekly-pnl">'+pnlUsd+'</span>'
    +'</div>'
  +'</div>';
}

async function _frInitWeeklyTopTrades(){
  var section = document.getElementById('fr-weekly-section');
  var scroll  = document.getElementById('fr-weekly-scroll');
  if(!section || !scroll) return;
  try{
    var solPriceUsd = 0;
    try{
      var br = await fetch('/api/wallet/balance', {credentials:'include'});
      var bd = await br.json();
      if(bd.ok) solPriceUsd = bd.sol_price_usd || 0;
    }catch(e){}

    var r = await fetch('/api/top-trades-week', {credentials:'include'});
    var d = await r.json();
    var trades = (d.ok && d.trades) || [];
    if(!trades.length){ section.style.display = 'none'; return; }

    scroll.innerHTML = trades.map(function(t){ return _frWeeklyCardHtml(t, solPriceUsd); }).join('');
    section.style.display = '';
  }catch(e){
    section.style.display = 'none';
  }
}

_frInitWeeklyTopTrades();

(function(){
  var weeklyScroll = document.getElementById('fr-weekly-scroll');
  if(weeklyScroll){
    weeklyScroll.addEventListener('click', function(e){
      var card = e.target.closest('.fr-weekly-card');
      if(!card) return;
      showTokenCard(card.dataset.sym, card.dataset.addr);
    });
  }
})();
</script>
<script src="/static/notif-poll.js?v={{ app_version }}"></script>
<script src="/static/page-loader.js?v={{ app_version }}"></script>
</body>
</html>
